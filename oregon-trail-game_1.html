<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Oregon Trail — Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap');

:root{
  --parchment:#E8DCC0; --parchment-dark:#C9AF7E; --ink:#2B1F16;
  --leather:#3B2A1E; --leather-dark:#241A12; --gold:#C9A227;
  --danger:#8B3A2C; --good:#4C6A46; --panel:#F1E7C9;
  --w-bg:#FFFFFF; --w-border:#C9A227;
  --bl-bg:#D7E4E6; --bl-border:#3E6B75;
  --bk-bg:#C3BDB3; --bk-border:#8B3A2C;
  --r-bg:#F0BC96; --r-border:#8B3A2C;
  --g-bg:#D9E4C9; --g-border:#4C6A46;
  --current-blue:#6EC6E0;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Special Elite', monospace; color:var(--ink);
  background:var(--leather-dark);
  background-image:radial-gradient(circle at 30% 20%, #4a3626 0%, #241a12 70%);
  min-height:100vh; padding:20px;
}
h1,h2,h3,.display{font-family:'Rye', serif;}
#app{max-width:1000px; margin:0 auto;}
.title-banner{text-align:center; color:var(--panel); padding:18px 10px 8px;}
.title-banner h1{font-size:2.4em; letter-spacing:3px; margin:0; text-shadow:0 3px 0 #000;}
.title-banner p{font-size:.85em; opacity:.7; margin:4px 0 0;}

.panel{
  background:var(--parchment); border:3px solid var(--leather);
  border-radius:6px; padding:18px 22px; margin-bottom:16px;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}
.panel h2{margin:0 0 10px; font-size:1.4em; color:var(--leather);}
.panel h3{margin:14px 0 6px; font-size:1.1em; color:var(--leather); border-bottom:1px solid var(--parchment-dark); padding-bottom:4px;}
.color-section{margin:14px 0 4px; font-family:'Rye',serif; font-size:1.15em; color:var(--leather);}
.color-desc{font-size:1em; opacity:.9; color:var(--leather-dark); margin:0 0 6px;}
.color-flavor{font-size:.85em; font-style:italic; opacity:.8; color:var(--leather-dark); margin:0 0 10px;}
.color-passive{font-size:.85em; color:var(--good); margin:0 0 10px; font-weight:bold;}

.stat-bar{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px; justify-content:center; align-items:center;}
.stat{background:var(--panel); border:2px solid var(--leather); border-radius:5px; padding:7px 16px; min-width:110px; text-align:center;}
.eat-btn{margin:0;}
.stat .label{font-size:.8em; letter-spacing:1px; opacity:.7;}
.stat .value{font-size:1.7em; font-weight:bold;}
.stat.energy .value{color:var(--danger);}
.stat.food .value{color:var(--good);}
.stat.cash .value{color:#8a6d1f;}
.wagon-strip{height:20px; margin:-18px -22px 12px; border-radius:6px 6px 0 0; box-shadow:inset 0 -2px 4px rgba(0,0,0,.25);}
.wagon-line{font-size:1.15em; font-weight:bold; text-align:center; margin:8px 0; font-family:'Rye',serif; color:var(--leather);}
.class-badge{display:inline-block; padding:2px 10px; border-radius:12px; margin:0 3px; border:1px solid rgba(0,0,0,.25);}
.passives-line{font-size:1em; text-align:center; margin:2px 0 6px; color:var(--ink);}
.religion-line{font-size:1em; text-align:center; margin:4px 0 8px; font-style:italic; opacity:.85; color:var(--ink);}
.stat-line{font-size:.92em; margin:4px 0; color:var(--ink);}
.stats-columns{display:flex; gap:22px; margin-top:6px;}
.stats-col{flex:1; min-width:0;}
@media (max-width:560px){ .stats-columns{flex-direction:column; gap:2px;} }

.sticky-stats{position:sticky; top:10px; z-index:80;}

.trail-track{display:flex; gap:2px; overflow-x:auto; padding:8px 0; align-items:center; justify-content:center;}
.stop{flex-shrink:0; text-align:center; font-size:.62em; width:54px;}
.stop .dot{width:22px; height:22px; border-radius:50%; margin:0 auto 3px; border:2px solid var(--leather); background:var(--parchment-dark); font-size:13px; line-height:18px; display:flex; align-items:center; justify-content:center;}
.stop.lodge .dot{width:29px; height:29px; background:var(--gold); font-size:15px; line-height:25px;}
.stop.finish .dot{background:var(--good); width:31px; height:31px; font-size:17px; line-height:27px;}
.stop.current .dot{outline:3px solid var(--current-blue); outline-offset:2px; box-shadow:0 0 8px 2px var(--current-blue);}
.stop.done .dot{opacity:.45;}
.stop .sub{display:block; font-size:.85em; opacity:.7;}
.track-line{flex-shrink:0; width:12px; height:2px; background:var(--leather); opacity:.5;}

.class-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:6px;}
.class-card{border:2px solid var(--leather); border-radius:5px; padding:10px 12px; background:var(--panel); cursor:pointer; transition:.15s;}
.class-card:hover{filter:brightness(1.05);}
.class-card.selected{outline:3px solid var(--danger); outline-offset:2px;}
.class-card.blocked{opacity:.4; cursor:not-allowed;}
.class-card h4{margin:0 0 4px; font-family:'Rye',serif; font-size:1.1em;}
.class-card p{margin:0; font-size:.82em; line-height:1.3;}
.class-card .card-emoji{font-size:1.8em; margin-bottom:2px;}
.class-card ul{margin:6px 0 0; padding-left:16px; font-size:.8em; line-height:1.4;}
.class-card.c-white, .trader-block.c-white{background:var(--w-bg); border-color:var(--w-border);}
.class-card.c-blue, .trader-block.c-blue{background:var(--bl-bg); border-color:var(--bl-border);}
.class-card.c-black{background:var(--bk-bg); border-color:#000;}
.trader-block.c-black{background:var(--bk-bg); border-color:var(--bk-border);}
.class-card.c-red, .trader-block.c-red{background:var(--r-bg); border-color:var(--r-border);}
.class-card.c-green, .trader-block.c-green{background:var(--g-bg); border-color:var(--g-border);}
.class-card.multi{padding:16px 14px;}
.class-card.multi .card-inner{border:1px solid rgba(0,0,0,.3); border-radius:4px; padding:8px 10px; color:var(--ink);}
.class-card.multi h4{color:var(--ink);}
.class-badge.multi{padding:4px; }
.class-badge.multi .badge-inner{display:inline-block; border:1px solid rgba(0,0,0,.3); color:var(--ink); padding:1px 8px; border-radius:9px;}
.trader-block.multi{color:var(--ink);}
.trader-block.items-panel{background:#F3E6C4; border-color:var(--gold);}

button{font-family:'Special Elite', monospace; background:var(--leather); color:var(--panel); border:2px solid var(--gold); border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.85em; margin:4px 6px 4px 0; transition:.15s;}
button:hover:not(:disabled){background:var(--danger);}
button:disabled{cursor:not-allowed; background:#6b5d47; color:#a89a7d; border-color:#7a6c50;}
button.secondary{background:transparent; color:var(--leather); border-color:var(--leather);}
button.small{padding:5px 10px; font-size:.8em;}

.card-box{border:2px dashed var(--leather); border-radius:5px; padding:14px; margin:10px 0; background:#fbf3dd; position:relative; transition:background .4s;}
.card-box.event{border-color:var(--danger);}
.card-box.weather-sun{background:linear-gradient(160deg,#fff6d8,#ffdf8f 85%); border-color:#c99a2e;}
.card-box.weather-rain{background:linear-gradient(160deg,#dfeaee,#a9c7d1 85%); border-color:#3E6B75;}
.card-box.weather-snow{background:linear-gradient(160deg,#f8fcff,#d7e8f2 85%); border-color:#6f9fb8;}
.weather-emoji{position:absolute; top:10px; right:14px; font-size:1.8em; filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.card-box .tag{display:inline-block; font-size:.65em; background:var(--danger); color:#fff; padding:2px 8px; border-radius:3px; letter-spacing:1px; margin-bottom:6px; margin-right:4px;}
.card-box.action .tag{background:var(--good);}
.option{border:1px solid var(--leather); border-radius:4px; padding:8px 10px; margin:6px 0;}
.result-block{margin:10px 0;}
.result-block .rline{margin-bottom:10px; line-height:1.4;}

.log{max-height:200px; overflow-y:auto; font-size:.8em; line-height:1.5;}
.log div{border-bottom:1px dotted #b8a06a; padding:3px 0;}
.log .loc-header{font-weight:bold; color:var(--leather); font-family:'Rye',serif; font-size:1.15em; margin-top:6px;}

.npc-list{font-size:.82em; display:grid; grid-template-columns:1fr 1fr; gap:4px 14px;}

.shop-row{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.85em; flex-wrap:wrap;}
.trader-block{border:1px solid var(--leather); border-radius:4px; padding:8px 10px; margin:6px 0; background:#fbf3dd;}
.trader-block .tname{font-family:'Rye',serif; font-size:1.15em;}
.affliction{font-size:.95em; background:#f0d9c0; border:1px solid var(--danger); border-radius:4px; padding:5px 10px; margin:3px 4px 3px 0; display:inline-block;}
[data-tip]{position:relative;}
[data-tip]::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:0; z-index:300;
  background:var(--leather-dark); color:var(--panel); padding:10px 14px; border-radius:4px;
  font-size:16px; line-height:1.4; width:280px; max-width:70vw; font-family:'Special Elite',monospace;
  white-space:pre-line;
  box-shadow:0 3px 10px rgba(0,0,0,.45); opacity:0; pointer-events:none;
  transition:opacity .12s ease .4s;
}
[data-tip]:hover::after{opacity:1;}
.offer-badge{display:inline-block; margin-left:4px; font-size:.9em; cursor:help; vertical-align:middle;}
.offer-badge.owned{color:var(--good);}
.offer-badge.locked{opacity:.7;}
.ref-line{font-size:.82em; margin:3px 0;}
.result-line{font-size:.8em; color:var(--good); margin:4px 0; font-style:italic;}
.desc-line{font-size:.82em; margin:3px 0 6px; opacity:.85;}

.gameover{text-align:center; padding:30px 10px;}
.gameover h2{font-size:2em; color:var(--danger);}
details{margin:6px 0;}
details summary{cursor:pointer; font-family:'Rye',serif; font-size:1.15em; color:var(--leather); padding:4px 0;}

@keyframes diceRoll{
  0%{ transform:scale(.3) rotate(0deg); opacity:0; }
  50%{ transform:scale(1.35) rotate(200deg); opacity:1; }
  100%{ transform:scale(1) rotate(360deg); opacity:1; }
}
.die{
  display:inline-block; min-width:28px; height:28px; line-height:28px; text-align:center;
  background:var(--gold); color:var(--leather); border-radius:6px; font-weight:bold;
  margin:0 4px; padding:0 4px; animation:diceRoll .5s ease-out;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DATA ============ */

const CLASSES = [
  {id:'pastor', name:'Pastor', color:'white', emoji:'⛪',
    desc:'Starts with Blessing of Health and Blessing of Protection. 3 predestined travelers tithe you each Lodge. Sells Prayer of Mending.',
    bullets:[{icon:'❤️',t:'Blessing of Health'},{icon:'🛡️',t:'Blessing of Protection'},{icon:'⛪',t:'Predestination'},{icon:'🕊️',t:'Prayer of Mending'}]},
  {id:'missionary', name:'Missionary', color:'white', emoji:'🙏',
    desc:'Starts with Blessing of Energy as a permanent passive. Convert up to 2 travelers at Lodge 1. Sells Prayer of Sustenance, Blessing of Energy, and Blessing of Navigation.',
    bullets:[{icon:'🙏',t:'Blessing of Energy'},{icon:'✝️',t:'Convert to Mormonism'},{icon:'🧭',t:'Blessing of Navigation'},{icon:'🍞',t:'Prayer of Sustenance'}]},
  {id:'hellfirepreacher', name:'Hellfire Preacher', color:'white', emoji:'🔥',
    desc:'Starts with Blessing of Ardor (+1 all rolls) and Blessing of Conviction (+2 after rolling 1-3), both permanent. Preaches sermons and sells Prayer of Cleansing Flame.',
    bullets:[{icon:'❤️‍🔥',t:'Blessing of Ardor'},{icon:'⛰️',t:'Blessing of Conviction'},{icon:'📖',t:'Fear of God (Sermon)'},{icon:'🕯️',t:'Prayer of Cleansing Flame'}]},
  {id:'ranger', name:'Ranger', color:'blue', emoji:'🧝‍♀️',
    desc:'Starts with a Field Guide and Map, plus 2 Anti-Venom. Field Guide helps you spot bad food; Anti-Venom softens snake and spider bites. Experienced: Actions cost 5 less energy. Ranger Assistance boosts a fellow traveler. Frontier Expert: perform both options on an Action card once per Lodge. Mend Livestock cures your own animal.',
    bullets:[{icon:'🗺️',t:'Field Guide & Map'},{icon:'🏔️',t:'Experienced'},{icon:'💐',t:'Ranger Assistance'},{icon:'🌲',t:'Frontier Expert'}]},
  {id:'doctor', name:'Doctor', color:'blue', emoji:'💉',
    desc:'Prepare Medicine each Lodge. Cure Disease or Stitch Wound on yourself. Triage: discard bad Events, 2 charges per Lodge.',
    bullets:[{icon:'💊',t:'Prepare Medicine'},{icon:'❤️‍🩹',t:'Cure Disease'},{icon:'🪡',t:'Stitch Wound'},{icon:'🔀',t:'Triage'}]},
  {id:'fortuneteller', name:'Fortune Teller', color:'blue', emoji:'🔮',
    desc:'Tarot Cards, Loaded Dice, Crystal Ball, Read the Stars. Fraud: any wrong prediction costs energy.',
    bullets:[{icon:'🔮',t:'Tarot Cards'},{icon:'🎲',t:'Loaded Dice'},{icon:'💎',t:'Crystal Ball'},{icon:'🌌',t:'Read the Stars'}]},
  {id:'vagrant', name:'Vagrant', color:'black', emoji:'🧟‍♂️',
    desc:'Weary: starts with -10 energy and -$20. Strapped: starts with a gun. Alms Recipient: your first minor blessing purchase from a White profession is free. Resilience: Disease lingering drains 5 less energy, and you may resist Theft. Roughneck: sells a Pledge of Protection (+2 vs Theft). Campfire: cold Weather drains 10 less energy. Scrounge: once per location, roll for a small item or cash.',
    bullets:[{icon:'😩',t:'Weary'},{icon:'🔫',t:'Strapped'},{icon:'🫴',t:'Alms Recipient'},{icon:'💪',t:'Resilience'},{icon:'⚔️',t:'Roughneck'},{icon:'🏕️',t:'Campfire'},{icon:'🗑️',t:'Scrounge'}]},
  {id:'outlaw', name:'Outlaw', color:'black', emoji:'🕵️',
    desc:'Cursed: Major Blessings cost you more. Thief and Black Market steal for you. Ruthless negates theft against you.',
    bullets:[{icon:'🕵️',t:'Thief'},{icon:'🏴',t:'Black Market'},{icon:'🛡️',t:'Ruthless'},{icon:'⚡',t:'Galvanized'}]},
  {id:'witchdoctor', name:'Witch Doctor', color:'black', emoji:'🧪',
    desc:'Jar of Leeches restores energy at a cost. Bloodletting cures disease. Purge cures hex and poison. Can resurrect fallen livestock.',
    bullets:[{icon:'🪱',t:'Jar of Leeches'},{icon:'🩸',t:'Bloodletting'},{icon:'✨',t:'Purge'},{icon:'⚰️',t:'Resurrect Livestock'}]},
  {id:'shaman', name:'Shaman', color:'black', emoji:'💀',
    desc:'Starts with 3 Blood Totems. Storm Calming Ritual negates Weather. Curse of Death kills without a gun, for bonus food on top of the normal hunt yield. Blood Offering boosts rolls after a hunt. Blood Oath for bonus energy at the next Lodge.',
    bullets:[{icon:'🩸',t:'Blood Totems'},{icon:'🌪️',t:'Storm Calming Ritual'},{icon:'☠️',t:'Curse of Death'},{icon:'🏹',t:'Blood Offering'},{icon:'🤝',t:'Blood Oath'}]},
  {id:'gunsmith', name:'Gunsmith', color:'red', emoji:'🔫',
    desc:'Starts with a gun. Marksman: +2 gun rolls. Craft and sell guns. Hunter: hunt at every Fort.',
    bullets:[{icon:'🎯',t:'Marksman'},{icon:'🛠️',t:'Craft Guns'},{icon:'🦌',t:'Hunter'}]},
  {id:'blacksmith', name:'Blacksmith', color:'red', emoji:'🔨',
    desc:'Starts with a gun. Unlock Bullet Smithing once: permanent +1 to gun rolls. Cauterize your own wounds.',
    bullets:[{icon:'🔨',t:'Bullet Smithing'},{icon:'🩹',t:'Cauterize'}]},
  {id:'woodworker', name:'Woodworker', color:'red', emoji:'🪵',
    desc:'Starts with a Wagon Spare Parts Kit, plus 4 more to sell to fellow travelers. Repairman fixes wagons for travelers who ask. Sturdy Wagon: perform min-energy Actions with 15 less energy. Wagoneer: +2 to Wagon-event rolls.',
    bullets:[{icon:'🧰',t:'Spare Parts Kits'},{icon:'🔧',t:'Repairman'},{icon:'🛡️',t:'Sturdy Wagon'},{icon:'🐴',t:'Wagoneer'}]},
  {id:'farmer', name:'Farmer', color:'green', emoji:'🌾',
    desc:'Starts with +30 food. Abundance, Animal Husbandry (+2 livestock rolls), and Heal Livestock.',
    bullets:[{icon:'📈',t:'Abundance'},{icon:'🐴',t:'Animal Husbandry'},{icon:'🐂',t:'Heal Livestock'}]},
  {id:'butcher', name:'Butcher', color:'green', emoji:'🥩',
    desc:'Starts with +30 food. Butchers hunted Animals for extra food at no cost. Butcher Livestock: salvages bonus food when your own livestock dies, or butchers a fellow traveler\'s fresh kill or fallen livestock for free (earning you 5 food). Food Preservation: food lost to Weather or spoilage is halved.',
    bullets:[{icon:'🍞',t:'Well Stocked'},{icon:'🪓',t:'Butcher'},{icon:'🐄',t:'Butcher Livestock'},{icon:'🧂',t:'Food Preservation'}]},
];

const MULTI_CLASSES = [
  {id:'snakecharmer', name:'Snake Charmer', colors:['black','green'], emoji:'🐍',
    desc:'Your snake performs one action per location: Milk Antivenom, Hypnosis, Bare Fangs, or Desperate Hunt. Most cost 5 food to feed the snake.',
    bullets:[{icon:'💉',t:'Milk Antivenom'},{icon:'😵‍💫',t:'Hypnosis'},{icon:'🦷',t:'Bare Fangs'},{icon:'🐇',t:'Desperate Hunt'}]},
  {id:'exorcist', name:'Exorcist', colors:['white','black'], emoji:'🧎',
    desc:'Blessing of Banishment purges any negative roll modifier that affects you personally — banked debuffs and the roll penalty from active afflictions — but not a location\'s own Weather difficulty. Blessing of Penance banks +2 to your next roll whenever you roll 6-10, at the cost of 5 energy. Prayer of Demon Expulsion drives out any affliction. Holy Water restores energy, doubled if something was purged at this location. Universalism refunds energy for casting on a traveler with no faith of their own.',
    bullets:[{icon:'🚫',t:'Blessing of Banishment'},{icon:'⚖️',t:'Blessing of Penance'},{icon:'👹',t:'Prayer of Demon Expulsion'},{icon:'💦',t:'Holy Water'},{icon:'🌍',t:'Universalism'}]},
  {id:'falconer', name:'Falconer', colors:['blue','green'], emoji:'🦅',
    desc:'Send your falcon out once per location: Eagle Eye, Hunt, Shiny, or Prepare.',
    bullets:[{icon:'👁️',t:'Eagle Eye'},{icon:'🦅',t:'Falcon Hunt'},{icon:'✨',t:'Falcon Shiny'},{icon:'🎯',t:'Preparation'}]},
  {id:'wolftamer', name:'Wolf Tamer', colors:['red','green'], emoji:'🐺',
    desc:'Your wolf performs one action per location: Lick Wounds, Vicious Hunt, or Go Fetch. Most cost 10 food to feed the wolf. Wolf Howl: automatically reroll once on any failed wolf roll.',
    bullets:[{icon:'👅',t:'Lick Wounds'},{icon:'🗡️',t:'Vicious Hunt'},{icon:'🐕',t:'Go Fetch'},{icon:'🌓',t:'Wolf Howl'}]},
  {id:'dovekeeper', name:'Dovekeeper', colors:['white','green'], emoji:'🕊️',
    desc:'Your dove performs one action per location: Blessing of Grace, Blessing of Nature, Prayer of Mercy, or Spiritual Peace. Most cost 5 food to feed the dove. Spiritual Peace costs no food and permanently unlocks a bonus food roll whenever your dove acts thereafter.',
    bullets:[{icon:'🌼',t:'Blessing of Grace'},{icon:'🌳',t:'Blessing of Nature'},{icon:'🤲',t:'Prayer of Mercy'},{icon:'🌊',t:'Spiritual Peace'}]},
];
CLASSES.push(...MULTI_CLASSES);

const COLOR_LABEL = {white:'⛪ White', blue:'📚 Blue', black:'💀 Black', red:'🛠️ Red', green:'🌿 Green'};
const COLOR_DESC = {white:'Buffs, Energy Restoration', blue:'Information, Utility, Card Interaction', black:'Risk, Sacrifice', red:'Craftsmanship, Items', green:'Food, Livestock'};
const COLOR_FLAVOR = {
  white:'Assemble your congregation and keep your party strong.',
  blue:'Use your advanced knowledge to manipulate the direction of your journey and aid your companions.',
  black:'Sacrifice your food and energy for greater rewards, if you survive.',
  red:'Use items to complete your actions with greater success.',
  green:'Generate and sell additional food to keep yourself nourished or increase wealth.',
};
const COLOR_PASSIVE = {
  white:'Class Passive — Congregation Discount: -$5 on anything you buy from a member of your congregation.',
  black:'Class Passive — Risky Opportunist: sacrifice 10 energy for +2 to any roll.',
  green:'Class Passive — Forage: once per location, forage for food (find 5 food on a roll of 7-10).',
};
const COLOR_ORDER = ['white','blue','black','red','green'];
const COLOR_HEX = {white:'#F3EAD3', blue:'#D7E4E6', black:'#3A2E28', red:'#EAD3C4', green:'#D9E4C9'};
const MULTI_SPLIT_HEX = {white:'#FFFFFF', blue:'#3E6B75', black:'#120C0A', red:'#8B3A2C', green:'#4C6A46'};
const MULTI_SPLIT_LIGHT = {white:'#FFFFFF', blue:'#D7E4E6', black:'#C3BDB3', red:'#F0BC96', green:'#D9E4C9'};

function classColor(id){ const c = CLASSES.find(x=>x.id===id); if(!c) return 'red'; return c.colors ? c.colors[0] : c.color; }
function classColors(id){ const c = CLASSES.find(x=>x.id===id); if(!c) return ['red']; return c.colors || [c.color]; }
function classEmoji(id){ const c = CLASSES.find(x=>x.id===id); return c ? c.emoji : '❔'; }
const COLOR_BG_VAR = {white:'--w-bg', blue:'--bl-bg', black:'--bk-bg', red:'--r-bg', green:'--g-bg'};
function traderBlockOpen(id){
  const c = CLASSES.find(x=>x.id===id);
  if(c && c.colors){
    const [c1,c2] = c.colors;
    const h1 = MULTI_SPLIT_LIGHT[c1], h2 = MULTI_SPLIT_LIGHT[c2];
    return `<div class="trader-block multi" style="background:linear-gradient(135deg, ${h1} 0%, ${h1} 49%, ${h2} 51%, ${h2} 100%);">`;
  }
  return `<div class="trader-block c-${classColor(id)}">`;
}
function classBadge(id){
  const c = CLASSES.find(x=>x.id===id);
  if(c && c.colors){
    const [c1,c2] = c.colors;
    const hex1 = MULTI_SPLIT_HEX[c1], hex2 = MULTI_SPLIT_HEX[c2];
    const light1 = MULTI_SPLIT_LIGHT[c1], light2 = MULTI_SPLIT_LIGHT[c2];

}

let audioCtx = null;
function toggleMute(){ uiState.muted = !uiState.muted; render(); }
function getAudioCtx(){
  if(uiState.muted) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, start, dur, type, gainPeak){
  const ctx = getAudioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime+start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak||0.2, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.05);
}
function playNoiseBurst(start, dur, gainPeak, filterFreq){
  const ctx = getAudioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime+start;
  const bufferSize = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(filterFreq||300, t0);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak||0.3, t0+0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(t0); noise.stop(t0+dur+0.05);
}
function playThunder(){
  playNoiseBurst(0, 1.2, 0.35, 150);
  playNoiseBurst(0.15, 0.8, 0.25, 90);
}
function playWolves(){
  const ctx = getAudioCtx(); if(!ctx) return;
  [0,0.35,0.7].forEach((start,i)=>{
    const t0 = ctx.currentTime+start;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300+i*20, t0);
    osc.frequency.linearRampToValueAtTime(700+i*30, t0+0.25);
    osc.frequency.linearRampToValueAtTime(350, t0+0.6);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.15, t0+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+0.65);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.7);
  });
}
function playBearGrowl(){
  const ctx = getAudioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime;
  const dur = 1.3;
  const osc = ctx.createOscillator();
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(450, t0);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(65, t0);
  osc.frequency.linearRampToValueAtTime(48, t0+0.5);
  osc.frequency.linearRampToValueAtTime(90, t0+dur);
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(16, t0);
  lfoGain.gain.setValueAtTime(10, t0);
  lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(0.32, t0+0.12);
  gain.gain.linearRampToValueAtTime(0.22, t0+0.65);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.05);
  lfo.start(t0); lfo.stop(t0+dur+0.05);
  playNoiseBurst(0.05, dur-0.1, 0.14, 200);
}

function buildNpcs(playerClasses){
  const remaining = CLASSES.map(c=>c.id).filter(id=>!playerClasses.includes(id));
  const shuffled = shuffleArray(remaining);
  const npcs = shuffled.map((classId,i) => ({name: NPC_NAMES[i % NPC_NAMES.length], classId,
    predestined:false, converted:false, sermonAttended:false}));
  return npcs;
}

function assignReligion(){
  const playerIsPastor = hasClass('pastor');
  const pastorNpcIdx = state.npcs.findIndex(n=>n.classId==='pastor');
  if(playerIsPastor){
    state.playerPredestined = true;
  } else if(pastorNpcIdx>=0){
    state.npcs[pastorNpcIdx].predestined = true;
  }
  let pool = [];
  if(!playerIsPastor) pool.push({type:'player'});
  state.npcs.forEach((n,i)=>{ if(i!==pastorNpcIdx) pool.push({type:'npc', idx:i}); });
  const chosen = shuffleArray(pool).slice(0,3);
  chosen.forEach(c=>{
    if(c.type==='player') state.playerPredestined = true;
    else state.npcs[c.idx].predestined = true;
  });
}

function classColorSortKey(id){
  const cols = classColors(id);
  const i0 = COLOR_ORDER.indexOf(cols[0]);
  const i1 = cols.length>1 ? COLOR_ORDER.indexOf(cols[1]) : i0;

function orderedNpcIndices(){

function startGame(selected, livestockType){
  state = freshState();
  state.classes = selected;
  state.npcs = buildNpcs(selected);
  assignReligion();
  if(hasClass('gunsmith') || hasClass('blacksmith') || hasClass('vagrant')) state.items.gun = true;
  if(hasClass('vagrant')){ state.energy -= 10; state.cash -= 20; }
  if(hasClass('farmer')) state.food += 30;
  if(hasClass('butcher')) state.food += 30;
  if(hasClass('shaman')) state.totems = 3;
  if(hasClass('witchdoctor')) state.witchLeeches = 2;
  if(hasClass('ranger')){ state.items.fieldGuide = true; state.items.map = true; state.antiVenom = 2; }
  if(hasClass('woodworker')){ state.repairKits = 1; state.repairKitsForSale = 4; }
  if(hasClass('missionary')) state.blessings.energyBlessingActive = true;
  if(hasClass('hellfirepreacher')){ state.blessings.ardorActive = true; state.blessings.convictionActive = true; }
  if(hasClass('exorcist')){ state.blessings.banishmentActive = true; state.blessings.penanceActive = true; state.holyWater = 2; }
  if(livestockType==='ox'){
    state.cash -= 75;
    state.livestock = {type:'Ox', alive:true, rollBonus:0, sick:false};
  } else {
    state.cash -= 95;
    state.livestock = {type:'Mule', alive:true, rollBonus:2, sick:false};
  }
  log(`<span class="loc-header">${LOCATIONS[0].name}</span> Your wagon sets out with $${state.cash}, ${state.energy} energy, ${state.food} food, and a ${state.livestock.type}.`);
  applyLodgeArrival();
  render();
}

function eatFood(amount){
  if(state.food < amount) return;
  state.food -= amount; energyAdd(amount);
  log(`Ate ${amount} food: +${amount} energy.`);
  saveGame(); render();
}

function livestockStatusText(){
  if(!state.livestock) return null;
  if(!state.livestock.alive) return 'Dead';
  if(state.livestock.sick) return state.livestock.sickType==='injured' ? 'Injured' : 'Diseased';
  return 'Healthy';
}

function playerReligion(){
  if(hasClass('pastor') || state.playerPredestined) return "Protestantism — Predestined member of the Pastor's Church";
  if(hasClass('missionary')) return "Mormonism — Head Missionary of your own Church";
  if(hasClass('hellfirepreacher')) return "Fear of God — Head Preacher of your own Church";
  if(state.playerConverted) return "Mormonism — Converted member of a Missionary's congregation";
  if(state.sermonAttended) return "Fear of God — Attended the Hellfire Preacher's Sermon";
  return "Pagan — No Religion";
}

function passivesSummary(){
  let parts = [];
  if(hasClass('pastor')) parts.push('Blessing of Health, Blessing of Protection');
  if(hasClass('missionary')) parts.push('Blessing of Navigation');
  if(hasClass('hellfirepreacher')) parts.push('Blessing of Ardor (+1 rolls), Blessing of Conviction');
  if(hasClass('pastor')||hasClass('missionary')||hasClass('hellfirepreacher')) parts.push('Congregation Discount (-$5 on purchases from your congregation)');
  if(hasClass('gunsmith')) parts.push('Marksman (+2 gun rolls)');
  if(hasClass('blacksmith') && state.blacksmithSmithingAcquired) parts.push('Bullet Smithing (+1 gun rolls)');
  if(hasClass('farmer')) parts.push('Animal Husbandry (+2 livestock rolls)');
  if(hasClass('outlaw')) parts.push('Ruthless, Galvanized');
  if(hasClass('vagrant')) parts.push('Resilience (-5 disease drain), Campfire (-10 cold weather drain)');
  if(hasClass('ranger')) parts.push('Experienced (-5 energy on Actions)');
  if(hasClass('woodworker')) parts.push('Sturdy Wagon (-15 energy minimums), Wagoneer (+2 wagon rolls)');
  if(hasClass('butcher')) parts.push('Butcher Livestock (salvage food from a dead animal), Food Preservation (-50% weather/spoilage food loss)');
  if(hasClass('exorcist')) parts.push('Blessing of Banishment (purges negative roll modifiers), Blessing of Penance (+2 next roll after rolling 6-10)');
  if(hasClass('outlaw')||hasClass('witchdoctor')||hasClass('shaman')||hasClass('snakecharmer')||hasClass('exorcist')) parts.push('Risky Opportunist');
  if(hasClass('farmer')||hasClass('falconer')||hasClass('snakecharmer')||hasClass('wolftamer')||hasClass('dovekeeper')) parts.push('Forage');
  return parts.length ? parts.join(' · ') : 'none yet';
}
function inventoryList(){
  let items = [];
  if(state.medicine>0) items.push(`${state.medicine} Medicine`);
  const gunCount = (state.items.gun?1:0)+(state.gunsForSale||0);
  if(gunCount>0) items.push(`${gunCount} Gun${gunCount>1?'s':''}`);
  if(state.totems>0) items.push(`${state.totems} Blood Totem${state.totems>1?'s':''}`);
  if(state.witchLeeches>0) items.push(`${state.witchLeeches} Jar${state.witchLeeches>1?'s':''} of Leeches`);
  if(state.antiVenom>0) items.push(`${state.antiVenom} Anti-Venom`);
  if(state.holyWater>0) items.push(`${state.holyWater} Holy Water`);
  if(state.items.fieldGuide) items.push('Field Guide');
  if(state.items.map) items.push('Map');
  const kitCount = (state.repairKits||0)+(state.repairKitsForSale||0);
  if(kitCount>0) items.push(`${kitCount} Repair Kit${kitCount>1?'s':''}`);
  if(state.animals){
    if(state.animals.small>0) items.push(`${state.animals.small} Small Animal${state.animals.small>1?'s':''}`);
    if(state.animals.medium>0) items.push(`${state.animals.medium} Medium Animal${state.animals.medium>1?'s':''}`);
    if(state.animals.large>0) items.push(`${state.animals.large} Large Animal${state.animals.large>1?'s':''}`);
  }
  return items.length ? items.join(', ') : 'None';
}
function afflictionsList(){
  if(!state.lingering.length) return 'None';
  const labelFor = {disease:'Disease', bleed:'Wound', hex:'Hex', poison:'Poisoned', venom:'Envenomed'};
  return state.lingering.map(l=>labelFor[l.type]||l.type).join(', ');
}
function activeAfflictionPenalty(){
  return state.lingering.filter(l=>l.type==='disease'||l.type==='bleed'||l.type==='venom'||l.type==='poison'||l.type==='hex').length;
}
function activeBlessingsList(){
  let list = [];
  if(hasClass('pastor') || state.blessings.protectionActive) list.push('Blessing of Protection');
  if(hasClass('pastor') || state.blessings.healthActive) list.push('Blessing of Health');
  if(state.blessings.energyBlessingActive) list.push('Blessing of Energy');
  if(state.blessings.navigationReady) list.push('Blessing of Navigation (ready)');
  if(state.blessings.sustenanceActive) list.push('Prayer of Sustenance (active)');
  if(state.blessings.ardorActive) list.push('Blessing of Ardor');

  if(state.blessings.banishmentActive) list.push('Blessing of Banishment');
  if(state.blessings.penanceActive) list.push('Blessing of Penance');
  if(state.blessings.doveGraceActive) list.push('Blessing of Grace');
  if(state.blessings.doveNatureActive) list.push('Blessing of Nature');
  if(state.blessings.doveSpiritualPeaceActive) list.push('Spiritual Peace');

}

function applyLodgeArrival(){
  const loc = LOCATIONS[state.loc];
  state.perLocation = {};

  if(state.snakeHungryDebt){
    state.food = clamp0(state.food - state.snakeHungryDebt);
    log(`🐍 Your snake is famished from the desperate hunt: -${state.snakeHungryDebt} food.`);
    state.snakeHungryDebt = 0;
  }

  if(state.blessings.sustenanceActive){
    energyAdd(5);
    log('Prayer of Sustenance: +5 energy this location.');
  }
  if(state.livestock && !state.livestock.alive){
    energyAdd(-15);
    log('No livestock to pull the wagon: -15 energy hauling it yourself.');
  }

  if(loc.type !== 'lodge' && loc.type !== 'finish') return;
  state.perLodge = { triageCharges:2, thiefCharges:2, blackMarketCharges:2, frontierExpertUsed:false, npcRequestSeen:false };
  state.sermonAttended = false;
  state.npcs.forEach(n=>n.sermonAttended=false);
  if(hasClass('farmer')){
    let bonus = state.food>=50 ? 10 : (state.food>=30 ? 5 : 0);
    if(bonus){ state.food += bonus; log(`Farmer's Abundance: +${bonus} food.`); }
  }
  if(state.blessings.energyBlessingActive && !hasClass('missionary')){
    state.blessings.energyBlessingActive = false; log('Blessing of Energy has expired.');
  }
  if(state.blessings.healthActive && !hasClass('pastor')){
    state.blessings.healthActive = false; log('Blessing of Health has expired.');
  }
  if(state.blessings.doveGraceActive){
    state.blessings.doveGraceActive = false; log('Blessing of Grace has expired.');
  }
  if(state.blessings.sustenanceActive){
    const r = roll();
    let bonus = r>=9 ? (r===10?15:10) : 5;
    energyAdd(bonus);
    log(`Prayer of Sustenance arrival roll: ${die(r)} — +${bonus} energy. Prayer expires here.`);
    state.blessings.sustenanceActive = false;
  }
  if(hasClass('pastor')){
    const n = state.npcs.filter(x=>x.predestined).length;
    if(n>0){ state.cash += 15*n; log(`Predestination: tithes collected from ${n} congregants — +$${15*n}.`); }
  }
  if((hasClass('pastor') || state.blessings.healthActive) && state.lingering.length){
    state.lingering=[]; log('Blessing of Health: all afflictions cured upon reaching the Lodge.');
  }
  if(state.playerPredestined && !hasClass('pastor')){
    state.cash = clamp0(state.cash-15);
    log('Tithe paid to your Pastor: -$15.');
  }
  if(hasClass('shaman') && state.bloodOathActive){
    energyAdd(35);
    log('Blood Oath fulfilled: +35 energy.');
    state.bloodOathActive = false;
  }
}

function currentLocation(){ return LOCATIONS[state.loc]; }

function buyFood(amount){
  const cost = amount*2;
  if(state.cash < cost) return;
  const loc = currentLocation();
  if(loc.type==='lodge' && curLevel()>=2){
    const bought = state.perLocation.foodBought||0;
    if(bought + amount > 35) return;
  }
  state.cash -= cost; state.food += amount;
  state.perLocation.foodBought = (state.perLocation.foodBought||0) + amount;
  log(`Bought ${amount} food for $${cost}.`);
  saveGame(); render();
}

function buyNewLivestock(type){
  if(!state.livestock || state.livestock.alive) return;
  if(type==='ox'){
    if(state.cash<75) return;
    state.cash -= 75;
    state.livestock = {type:'Ox', alive:true, rollBonus:0, sick:false};
    log('Bought a new Ox to pull your wagon ($75).');
  } else {
    if(state.cash<95) return;
    state.cash -= 95;
    state.livestock = {type:'Mule', alive:true, rollBonus:2, sick:false};
    log('Bought a new Mule to pull your wagon ($95).');
  }
  saveGame(); render();
}

function goToEvent(){
  const pool = eventPool(curLevel());
  const ev = pool[Math.floor(Math.random()*pool.length)];
  const scried = state.crystalBallPending;
  const needsPredict = hasClass('fortuneteller') && !state.perLocation.tarotUsed && !scried;
  state.pendingEvent = {def: ev, resolved:false, revealed: !needsPredict, crystalBallChoice: scried};
  if(scried){ state.crystalBallPending = false; log('Crystal Ball: the Fortune Teller shows you what lies ahead.'); }
  if(!needsPredict) maybePlayEventAmbience(ev);
  state.phase = 'event';
  saveGame(); render();
}

function rerollEvent(){
  if(!hasClass('doctor') || (state.perLodge.triageCharges||0)<=0) return;
  state.perLodge.triageCharges -= 1;
  const oldName = state.pendingEvent.def.name;
  const oldTarot = state.pendingEvent.tarotGuess;
  const oldDice = state.pendingEvent.diceGuess;
  log('Doctor uses Triage: discards the drawn Event and draws a new one.');
  const pool = eventPool(curLevel()).filter(e=>e.name!==oldName);
  const ev = pool[Math.floor(Math.random()*pool.length)];
  state.pendingEvent = {def: ev, resolved:false, revealed:true, tarotGuess:oldTarot, diceGuess:oldDice};
  maybePlayEventAmbience(ev);
  saveGame(); render();
}

function changeFutureCrystalBall(){
  const pe = state.pendingEvent;
  if(!pe || !pe.crystalBallChoice || pe.crystalBallResolved) return;
  const oldName = pe.def.name;
  const oldTarot = pe.tarotGuess;
  const oldDice = pe.diceGuess;
  log('You choose to change your future — the Event shifts.');
  const pool = eventPool(curLevel()).filter(e=>e.name!==oldName);
  const ev = pool[Math.floor(Math.random()*pool.length)];
  state.pendingEvent = {def: ev, resolved:false, revealed:true, tarotGuess:oldTarot, diceGuess:oldDice};
  maybePlayEventAmbience(ev);
  saveGame(); render();
}
function acceptFutureCrystalBall(){
  const pe = state.pendingEvent;
  if(!pe) return;
  pe.crystalBallResolved = true;
  saveGame(); render();
}

function vagrantResilienceEvent(){
  const pe = state.pendingEvent;
  if(!hasClass('vagrant') || !pe || pe.def.cat!=='THEFT' || pe.resilienceAttempted || state.energy<5) return;
  energyAdd(-5);
  pe.resilienceAttempted = true;
  const r = roll();
  if(r>=6){
    pe.resilienceSuccess = true;
    setResult('vagrant_resilience', `💪 Resilience succeeds: rolled ${die(r)} (needed 6+). Your goods are safe from theft.`);
    log(`Resilience succeeds (rolled ${r}, needed 6+): goods protected from theft.`);
  } else {
    setResult('vagrant_resilience', `💪 Resilience fails: rolled ${die(r)} (needed 6+). The 5 energy is spent regardless.`);
    log(`Resilience fails (rolled ${r}, needed 6+). Energy spent regardless.`);
  }
  saveGame(); render();
}

function grantRandomSmallItem(){
  const items = ['medicine','antivenom','leeches','repairKit','totems','food'];
  const pick = items[Math.floor(Math.random()*items.length)];
  let desc;
  if(pick==='medicine'){ state.medicine += 1; desc='Medicine'; }
  else if(pick==='antivenom'){ state.antiVenom = (state.antiVenom||0)+1; desc='Anti-Venom'; }
  else if(pick==='leeches'){ state.witchLeeches = (state.witchLeeches||0)+1; desc='a Jar of Leeches'; }
  else if(pick==='repairKit'){ state.repairKits = (state.repairKits||0)+1; desc='a Wagon Spare Parts Kit'; }
  else if(pick==='totems'){ state.totems += 2; desc='2 Blood Totems'; }
  else { state.food += 5; desc='5 food'; }
  return desc;
}
function vagrantScrounge(){
  if(!hasClass('vagrant') || state.perLocation.scrounged) return;
  state.perLocation.scrounged = true;
  const r = roll();
  let msg;
  if(r>=6){
    const desc = grantRandomSmallItem();
    msg = `🗑️ Scrounge: rolled ${die(r)}, found ${desc}.`;
  } else {
    state.cash += 5;
    msg = `🗑️ Scrounge: rolled ${die(r)}, found $5.`;
  }
  setResult('vagrant_scrounge', msg);
  log(msg.replace(/<[^>]+>/g,''));
  saveGame(); render();
}

function shamanStormRitual(){
  const pe = state.pendingEvent;
  if(!hasClass('shaman') || !pe || pe.def.cat!=='WEATHER' || pe.stormAttempted) return;
  const level = curLevel();
  const cost = 5*level;
  if(state.food<cost) return;
  state.food -= cost;
  pe.stormAttempted = true;
  const bankedMod = state.rollMod;
  state.rollMod = 0;
  const raw = roll();
  const effective = raw + bankedMod - level;
  if(effective>=3){
    pe.stormNegated = true;
    setResult('shaman_storm', `🌪️ Storm Calming Ritual succeeds: rolled ${die(raw)}${bankedMod?` +${bankedMod} banked`:''}, -${level} = ${effective}. The Weather event is negated!`);
    log(`Storm Calming Ritual succeeds (rolled ${raw}${bankedMod?` +${bankedMod} banked`:''}, -${level} = ${effective}): the Weather event is fully negated.`);
    saveGame();
    resolveEvent();
    return;
  } else {
    setResult('shaman_storm', `🌪️ Storm Calming Ritual fails: rolled ${die(raw)}${bankedMod?` +${bankedMod} banked`:''}, -${level} = ${effective} (needed 3+). Food spent regardless.`);
    log(`Storm Calming Ritual fails (rolled ${raw}${bankedMod?` +${bankedMod} banked`:''}, -${level} = ${effective}, needed 3+). The food is spent regardless.`);
  }
  saveGame(); render();
}

}

function effectiveEventDef(pe){
  if(!pe.def.branches) return pe.def;
  if(!pe.chosenBranch) return pe.def;
  const b = pe.def.branches.find(x=>x.key===pe.chosenBranch);
  return {...pe.def, tiers: b.tiers, mod: b.mod};
}
function chooseEventBranch(key){
  const pe = state.pendingEvent;
  if(!pe || !pe.def.branches || pe.chosenBranch) return;
  const b = pe.def.branches.find(x=>x.key===key);
  if(!b) return;
  if(b.requiresGun && !state.items.gun) return;
  pe.chosenBranch = key;
  maybePlayEventAmbience(pe.def);
  saveGame(); render();
}

function resolveEvent(){
  const pe = state.pendingEvent;
  const ev = effectiveEventDef(pe);
  let r = roll();
  const bankedMod = state.rollMod;
  state.rollMod = 0;
  let mod = ((ev.mod && !pe.medicineUsed && !pe.antiVenomUsed) ? ev.mod : 0) + (pe.totemPending?3:0) + bankedMod;
  if(state.blessings.ardorActive) mod += 1;
  if(ev.cat==='LIVESTOCK' && state.livestock && state.livestock.alive) mod += livestockRollBonus();
  if(ev.cat==='WAGON' && hasClass('woodworker')){ mod += 2; }

  let lines = [];
  if(ev.cat==='WAGON' && hasClass('woodworker')) lines.push('🐴 Wagoneer: +2 to this roll.');

  if((hasClass('pastor')||state.blessings.protectionActive) && (ev.cat==='THEFT' || ev.cat==='WEATHER')){ mod += 1; lines.push('🛡️ Blessing of Protection: +1 to this roll.'); }
  if(state.pledgeProtectionActive && ev.cat==='THEFT'){ mod += 2; lines.push('⚔️ Pledge of Protection: +2 to this roll.'); }
  if(state.blessings.ardorActive) lines.push('❤️‍🔥 Blessing of Ardor: +1 to this roll.');
  if(ev.cat==='WEATHER' && state.readStarsGuess && !state.readStarsConsumed && ev.name.toLowerCase().includes(state.readStarsGuess)){
    mod += 3; state.readStarsConsumed = true;
    lines.push(`🌌 Read the Stars correctly predicted ${state.readStarsGuess}: +3 to this roll.`);
  }

  if(ev.cat==='WEATHER' && pe.stormNegated){
    lines.push(`Rolled ${die(r)}.`);
    lines.push('🌪️ Storm Calming Ritual fully negated this Weather event. No energy lost.');
    if(state.blessings.convictionActive && r<=3){ state.rollMod += 2; lines.push('⛰️ Blessing of Conviction procs: +2 to next roll.'); }
    finishEventNoLoss(pe, ev, lines);
    return;
  }

  if(ev.cat==='POISON' && state.items.fieldGuide){ mod += 2; lines.push('🗺️ Field Guide: +2 to this roll — you can identify bad food.'); }
  if(state.blessings.doveNatureActive && (ev.cat==='POISON'||ev.cat==='VENOM'||ev.cat==='HEX')){ mod += 2; lines.push('🌳 Blessing of Nature: +2 to this roll.'); }
  const afflictionPenalty = activeAfflictionPenalty();
  if(afflictionPenalty){
    if(state.blessings.banishmentActive) lines.push(`🚫 Blessing of Banishment purges the ${afflictionPenalty} affliction roll penalty.`);
    else { mod -= afflictionPenalty; lines.push(`🤒 Afflictions: -${afflictionPenalty} to this roll (${afflictionPenalty} active).`); }
  }

  const finalRoll = r + mod;
  const tiers = [...ev.tiers].sort((a,b)=>b.min-a.min);
  let tier = tiers.find(t => finalRoll >= t.min) || tiers[tiers.length-1];
  const bestTier = tiers[0];
  const hitBest = tier === bestTier;
  if(hitBest) playSuccess(); else if(tier===tiers[tiers.length-1]) playFailure();

  lines.push(`Rolled ${die(r)}${mod?` (modifiers ${mod>=0?'+':''}${mod})`:''} = ${finalRoll}.${hitBest?' 🌟 Best outcome!':''}`);

  if(state.blessings.convictionActive && r<=3){ state.rollMod += 2; lines.push('⛰️ Blessing of Conviction procs (raw roll 1-3): +2 to next roll.'); }

  let eLoss = tier.e || 0;
  const rawLoss = eLoss;
  if(ev.cat === 'DISEASE' && hasClass('doctor')){ eLoss = clamp0(eLoss - 10); lines.push(`❤️‍🩹 Doctor: this Disease drains 10 less energy (${eLoss} instead of ${rawLoss}).`); }
  if(ev.cat === 'WOUND' && hasClass('blacksmith')){ eLoss = clamp0(eLoss - 5); lines.push(`🩹 Blacksmith: this Wound drains 5 less energy (${eLoss} instead of ${rawLoss}).`); }
  if(ev.cat === 'WEATHER' && ev.name.toLowerCase().includes('snow') && hasClass('vagrant')){ eLoss = clamp0(eLoss - 10); lines.push(`🏕️ Campfire: this cold Weather drains 10 less energy (${eLoss} instead of ${rawLoss}).`); }
  if(ev.cat === 'WEATHER' && state.blessings.navigationReady){
    eLoss = 0; state.blessings.navigationReady = false;
    lines.push('🧭 Blessing of Navigation negated this Weather event entirely!');
  }
  if(pe.medicineUsed){
    const before = eLoss;
    eLoss = clamp0(eLoss - 15);
    lines.push(`💊 Medicine softened the blow: lost ${eLoss} energy instead of ${before}, roll modifier ignored.`);
  }
  if(pe.antiVenomUsed){
    const before = eLoss;
    eLoss = clamp0(eLoss - 15);
    lines.push(`🐍 Anti-Venom softened the bite: lost ${eLoss} energy instead of ${before}, roll modifier ignored.`);
  }
  if((ev.cat==='DISEASE'||ev.cat==='WOUND') && (hasClass('pastor') || state.blessings.healthActive)){
    const before = eLoss;
    eLoss = Math.ceil(eLoss/2);
    lines.push(`❤️ Blessing of Health halves the energy loss: lost ${eLoss} energy instead of ${before}.`);
  }

  energyAdd(-eLoss);
  if(eLoss || rawLoss) lines.push(`Lost ${eLoss} energy.`);

  const theftLossPresent = (tier.cash || tier.foodLoss) && ev.cat==='THEFT';
  if(theftLossPresent && hasClass('outlaw')){
    lines.push('🛡️ Ruthless: you lose nothing to the thieves.');
    if(r>=6){ state.cash += 20; lines.push('⚡ Ruthless: stole $20 back from your attackers.'); }
  } else if(theftLossPresent && pe.resilienceSuccess){
    lines.push('💪 Resilience protected your goods: nothing lost.');
  } else if(theftLossPresent && state.perLocation.bareFangsActive){
    lines.push('🐍 Bare Fangs: your snake wards off the attackers — nothing lost.');
  } else {
    if(tier.cash){ state.cash = clamp0(state.cash - tier.cash); lines.push(`Lost $${tier.cash}.`); }
    let foodLossAmt = tier.foodLoss || (tier.foodLossPct ? Math.floor(state.food*tier.foodLossPct) : 0);
    if(foodLossAmt){
      if(hasClass('butcher') && ev.cat==='WEATHER'){
        const before = foodLossAmt;
        foodLossAmt = Math.ceil(foodLossAmt/2);
        lines.push(`🧂 Food Preservation halves the spoilage: lost ${foodLossAmt} food instead of ${before}.`);
      }
      state.food = clamp0(state.food - foodLossAmt);
      lines.push(`Lost ${foodLossAmt} food.`);
    }
  }

  if(tier.feed && state.livestock && state.livestock.alive){
    pe._awaitingFeedChoice = true;
    pe._tier = tier; pe._lines = lines; pe._hitBest = hitBest; pe._r = r;
    saveGame(); render(); return;
  }

  if(tier.sick && state.livestock && state.livestock.alive){
    state.livestock.sick = true;
    state.livestock.sickType = Math.random()<0.5 ? 'injured' : 'diseased';
    lines.push(`Your ${state.livestock.type} falls ill and will drain extra energy each location until healed.`);
  }

  if(tier.wagon && !state.wagonBroken){
    state.wagonBroken = true;
    lines.push('Your wagon breaks down and will drain extra energy each location until repaired.');
  }

  finalizeEventTail(pe, ev, tier, lines, r, hitBest);
}

function finishEventNoLoss(pe, ev, lines){
  pe.resolved = true;
  pe.resultLines = lines;
  log(`<span class="loc-header">${currentLocation().name}</span> <strong>${ev.name}</strong>: negated by Storm Calming Ritual.`);
  if(checkGameOver()) return;

}

function resolveFeedChoice(feed){
  const pe = state.pendingEvent;
  pe._awaitingFeedChoice = false;
  const ev = pe.def; const tier = pe._tier; let lines = pe._lines;
  if(feed && state.food >= tier.feed){
    state.food -= tier.feed;
    lines.push(`Fed your ${state.livestock.type} ${tier.feed} food to save it.`);
  } else {
    state.livestock.alive = false;
    lines.push(`Your ${state.livestock.type} dies. It can no longer pull the wagon, and drains 15 energy at each location until resurrected or replaced.`);
    if(hasClass('butcher')){
      const gain = state.livestock.type==='Ox' ? 15 : 10;
      state.food += gain;
      lines.push(`🐄 Butcher Livestock: salvaged ${gain} food from the carcass.`);
    }
  }
  finalizeEventTail(pe, ev, tier, lines, pe._r, pe._hitBest);
}

function finalizeEventTail(pe, ev, tier, lines, r, hitBest){
  let lingerAmt = tier.linger;
  if(lingerAmt && pe.medicineUsed) lingerAmt = clamp0(lingerAmt - 15);
  if(lingerAmt && hasClass('pastor') && ev.cat==='DISEASE') lingerAmt = Math.ceil(lingerAmt/2);
  if(lingerAmt){ state.lingering.push({name: ev.name, amt: lingerAmt, type:'disease'}); lines.push(`Lingers -${lingerAmt} energy/location until cured (or the next Lodge).`); }

  let bleedAmt = tier.bleed;
  if(bleedAmt && hasClass('pastor') && ev.cat==='WOUND') bleedAmt = Math.ceil(bleedAmt/2);
  if(bleedAmt){ state.lingering.push({name: ev.name, amt: bleedAmt, type:'bleed'}); lines.push(`Bleeding -${bleedAmt} energy/location until treated (or the next Lodge).`); }

  let venomAmt = tier.venom;
  if(venomAmt && pe.antiVenomUsed) venomAmt = clamp0(venomAmt - 15);
  if(venomAmt){ state.lingering.push({name: ev.name, amt: venomAmt, type:'venom'}); lines.push(`Envenomed -${venomAmt} energy/location until cured (or the next Lodge).`); }

  let poisonAmt = tier.poison;
  if(poisonAmt){ state.lingering.push({name: ev.name, amt: poisonAmt, type:'poison'}); lines.push(`Poisoned -${poisonAmt} energy/location until cured (or the next Lodge).`); }

  let hexAmt = tier.hex;
  if(hexAmt){ state.lingering.push({name: ev.name, amt: hexAmt, type:'hex'}); lines.push(`Hexed -${hexAmt} energy/location until cured (or the next Lodge).`); }

  if(pe.totemPending){
    state.totems -= 1;
    state.food = clamp0(state.food-5);
    lines.push('🩸 Blood Totem: sacrificed 5 food for the +3 roll bonus.');
  }

  const beMsg = tryEnergyBlessing(r);
  if(beMsg) lines.push(beMsg);
  const penMsg = tryPenanceBlessing(r);
  if(penMsg) lines.push(penMsg);
  const graceMsg = tryGraceBlessing(r);
  if(graceMsg) lines.push(graceMsg);

  if(pe.tarotGuess){
    if(pe.tarotGuess === ev.diff){ energyAdd(15); lines.push(`🔮 Tarot Cards correct (predicted ${pe.tarotGuess}): +15 energy!`); }
    else { energyAdd(-5); lines.push(`🔮 Tarot Cards wrong (predicted ${pe.tarotGuess}, was ${ev.diff}). Fraud: -5 energy.`); }
  }
  if(pe.diceGuess !== undefined){
    if(pe.diceGuess === hitBest){ state.rollMod += 1; lines.push('🎲 Loaded Dice correct: +1 to next roll banked!'); }
    else { energyAdd(-5); lines.push('🎲 Loaded Dice wrong. Fraud: -5 energy.'); }
  }

  pe.resolved = true;
  pe.resultLines = lines;
  log(`<span class="loc-header">${currentLocation().name}</span> <strong>${ev.name}</strong>: ${lines.join(' ')}`);
  if(checkGameOver()) return;
  saveGame(); render();
}

function applyLingering(){
  let total = 0;
  state.lingering.forEach(l=>{
    let amt = l.amt;
    if(l.type==='disease' && hasClass('vagrant')) amt = clamp0(amt-5);
    total += amt;
  });
  if(state.livestock && state.livestock.sick) total += 10;
  if(state.wagonBroken) total += 10;
  if(total>0){
    energyAdd(-total);
    let parts = state.lingering.map(l=>l.name);
    if(state.livestock && state.livestock.sick) parts.push(`sick ${state.livestock.type}`);
    if(state.wagonBroken) parts.push('broken wagon');
    log(`Lingering effects drain ${total} energy: ${parts.join(', ')}.`);
  }
}

function goToAction(){
  applyLingering();
  if(checkGameOver()) return;
  let act = actionPool()[Math.floor(Math.random()*actionPool().length)];
  if(act.name==='Hunt or Gather' && hasClass('shaman')){
    act = JSON.parse(JSON.stringify(act));
    act.options.push({label:'Curse of Death (needs 30 energy, ritual kill, no gun needed)', curse:true, hunt:true, min:30, e:-15,
      tiers:[{min:9,food:40},{min:5,food:20},{min:1,food:5}],
      curseTiers:[{min:7,bonus:10},{min:4,bonus:5},{min:1,bonus:0,fail:true}]});
  }
  if(act.name!=='Hunt or Gather' && Math.random()<0.25){
    act = JSON.parse(JSON.stringify(act));
    act.options.push(huntOptionTemplate());
  }
  state.pendingAction = {def: act, resolved:false};
  state.phase = 'action';
  saveGame(); render();
}

function effMin(min){ return (hasClass('woodworker') && min) ? Math.max(0, min-15) : min; }
function actionLocked(opt){
  const min = effMin(opt.min);
  return (min && state.energy<min) || (opt.gun && !opt.curse && !state.items.gun);
}
function actionWhy(opt){
  const min = effMin(opt.min);
  if(min && state.energy<min) return `Needs ${min} energy`;
  if(opt.gun && !opt.curse && !state.items.gun) return 'Needs a gun';
  return 'Choose';
}

function applyActionOption(opt, labelPrefix){
  let lines = [`${labelPrefix}"${opt.label}".`];
  let tier=null;
  if(opt.tiers){
    const r = roll();
    let gunBonus = 0;
    if(opt.gun){
      gunBonus += hasClass('gunsmith')?2:0;
      gunBonus += state.blacksmithSmithingAcquired?1:0;
    }
    const bankedMod = state.rollMod;
    state.rollMod = 0;
    const ardorBonus = state.blessings.ardorActive?1:0;
    const totemBonus = state.pendingAction.totemPending ? 3 : 0;
    state.pendingAction.totemPending = false;
    const rawAfflictionPenalty = activeAfflictionPenalty();
    const afflictionPurged = rawAfflictionPenalty>0 && state.blessings.banishmentActive;
    const afflictionPenalty = afflictionPurged ? 0 : rawAfflictionPenalty;
    const effRoll = r + gunBonus + bankedMod + ardorBonus + totemBonus - afflictionPenalty;
    const tiers = [...opt.tiers].sort((a,b)=>b.min-a.min);
    tier = tiers.find(t=>effRoll>=t.min) || tiers[tiers.length-1];
    const hitBest = tier === tiers[0];
    const isWorstTier = tier === tiers[tiers.length-1];
    if(hitBest) playSuccess(); else if(isWorstTier) playFailure();
    lines.push(`Rolled ${die(r)}${gunBonus?` (+${gunBonus} gun passive)`:''}${bankedMod?` (+${bankedMod} banked)`:''}${ardorBonus?` (+${ardorBonus} Ardor)`:''}${totemBonus?' (+3 Blood Totem)':''}${afflictionPenalty?` (-${afflictionPenalty} afflictions)`:''}${afflictionPurged?' (🚫 affliction penalty purged by Banishment)':''}.${hitBest?' 🌟 Best outcome!':''}`);
    if(totemBonus){
      state.totems -= 1;
      state.food = clamp0(state.food-5);
      lines.push('🩸 Blood Totem: sacrificed 5 food for the +3 roll bonus.');
    }
    if(state.blessings.convictionActive && r<=3){ state.rollMod += 2; lines.push('⛰️ Blessing of Conviction procs (raw roll 1-3): +2 to next roll.'); }
    const beMsg = tryEnergyBlessing(r);
    if(beMsg) lines.push(beMsg);
    const penMsg = tryPenanceBlessing(r);
    if(penMsg) lines.push(penMsg);
    const graceMsg = tryGraceBlessing(r);
    if(graceMsg) lines.push(graceMsg);
    let curseFailed = false;
    if(opt.curse && opt.curseTiers){
      const curseTiers = [...opt.curseTiers].sort((a,b)=>b.min-a.min);
      const curseTier = curseTiers.find(t=>effRoll>=t.min) || curseTiers[curseTiers.length-1];
      if(curseTier.fail){
        curseFailed = true;
        tier = {...tier, food:0};
        lines.push('💀 Curse of Death: the ritual fails — no kill.');
      } else if(curseTier.bonus){
        tier = {...tier, food:(tier.food||0)+curseTier.bonus};
        lines.push(`💀 Curse of Death: +${curseTier.bonus} bonus food from the ritual kill.`);
      }
    }
    if(opt.hunt && !curseFailed){
      const size = hitBest ? 'large' : (isWorstTier ? 'small' : 'medium');
      if(!state.animals) state.animals = {small:0,medium:0,large:0};
      state.animals[size] = (state.animals[size]||0)+1;
      lines.push(`🦌 Hunting brings back a ${size} animal for the Butcher.`);
    }
  }

  let eDelta = opt.e || 0;
  if(hasClass('ranger') && eDelta<0){ eDelta = Math.min(0, eDelta+5); lines.push('🏔️ Experienced: -5 less energy cost.'); }
  let foodGain = (tier && tier.food) || 0;
  if(foodGain>0 && hasClass('gunsmith') && (opt.gun||opt.curse)){ foodGain += 5; lines.push('🦌 Gunsmith: +5 bonus food.'); }
  if(foodGain>0 && hasClass('shaman') && (opt.gun||opt.curse)){ foodGain = clamp0(foodGain-5); state.rollMod += 2; lines.push('🏹 Shaman Blood Offering: sacrificed 5 food for +2 to next roll.'); }
  let cashGain = opt.cash || (tier && tier.cash) || 0;
  let modGain = opt.mod || (tier && tier.mod) || 0;

  energyAdd(eDelta);
  state.food += foodGain;
  state.cash += cashGain;
  if(modGain) state.rollMod += modGain;

  if(eDelta) lines.push(`Energy ${eDelta>0?'+':''}${eDelta}.`);
  if(foodGain) lines.push(`+${foodGain} food.`);
  if(cashGain) lines.push(`+$${cashGain}.`);
  if(modGain) lines.push(`+${modGain} to next roll (banked).`);
  return lines;
}

function resolveAction(optIndex){
  const act = state.pendingAction.def;
  const opt = act.options[optIndex];
  if(actionLocked(opt)) return;

  const lines = applyActionOption(opt, 'Chose ');
  state.pendingAction.resolved = true;
  state.pendingAction.chosenIndex = optIndex;
  state.pendingAction.resultLines = lines;
  log(`<strong>${act.name}</strong>: ${lines.join(' ')}`);
  if(checkGameOver()) return;
  saveGame(); render();
}

function resolveBothActions(){
  if(!hasClass('ranger') || state.perLodge.frontierExpertUsed) return;
  const pa = state.pendingAction;
  if(!pa || pa.resolved) return;
  const opts = pa.def.options;
  if(opts.length<2 || actionLocked(opts[0]) || actionLocked(opts[1])) return;

  state.perLodge.frontierExpertUsed = true;
  const lines1 = applyActionOption(opts[0], 'Chose ');
  const lines2 = applyActionOption(opts[1], 'Also chose ');
  const allLines = lines1.concat(lines2);
  state.pendingAction.resolved = true;
  state.pendingAction.chosenIndex = -1;
  state.pendingAction.resultLines = allLines;
  log(`<strong>${pa.def.name}</strong> (Frontier Expert — both actions): ${allLines.join(' ')}`);
  if(checkGameOver()) return;
  saveGame(); render();
}

function checkGameOver(){
  if(state.energy<=0 && state.food<=0){ state.phase='over'; log('Your wagon can go no further. The journey ends here.'); saveGame(); render(); return true; }
  return false;
}

function advanceLocation(){
  state.loc++;
  if(state.loc >= LOCATIONS.length-1){
    state.loc = LOCATIONS.length-1;
    state.phase='victory';
    log(`<span class="loc-header">OREGON</span> You made it! Journey complete.`);
    saveGame(); render(); return;
  }
  applyLodgeArrival();
  const loc = currentLocation();
  log(`<span class="loc-header">${loc.name}${loc.sub?' · '+loc.sub:''}</span> Arrived.`);
  maybeGenerateNpcRequest();
  state.phase = (loc.type==='lodge') ? 'lodge_shop' : 'event';
  if(state.phase==='event'){ saveGame(); goToEvent(); return; }
  saveGame(); render();
}

function falconAction(kind){

    const gain = effR>=6?30:20;
    state.cash += gain;
    resultMsg = `Falcon finds shinies: rolled ${die(r)}${prepBonus?` (+${prepBonus} prepared)`:''}, +$${gain}${prepFree?' (no food spent, prepared)':''}.`;

function snakeRollBanked(){
  const banked = state.snakeRollMod || 0;
  state.snakeRollMod = 0;
  const raw = roll();
  const eff = raw + banked;
  return {eff, raw, banked};
}
function snakeAction(kind){
  if(!hasClass('snakecharmer') || state.perLocation.snakeUsed) return;
  const foodCost = 5;
  let resultMsg = '';
  if(kind==='milkAntivenom'){
    if(state.food<foodCost) return;
    state.perLocation.snakeUsed = true;
    state.food -= foodCost;
    const {eff, banked} = snakeRollBanked();
    const gain = eff>=6 ? 2 : 1;
    state.antiVenom = (state.antiVenom||0)+gain;
    resultMsg = `💉 Milk Antivenom: rolled ${die(eff)}${banked?` (${banked} banked)`:''}, produced ${gain} Anti-Venom.`;
  } else if(kind==='hypnosis'){
    if(state.food<foodCost) return;
    state.perLocation.snakeUsed = true;
    state.food -= foodCost;
    const {eff, banked} = snakeRollBanked();
    if(eff>=6){
      const candidates = state.npcs.map((n,i)=>({n,i,offers: npcOffer(n,curLevel()).filter(o=>!o.needsAffliction && (!o.disabledIf || !o.disabledIf()))})).filter(c=>c.offers.length>0);
      if(candidates.length){
        const pick = candidates[Math.floor(Math.random()*candidates.length)];
        const offer = pick.offers[Math.floor(Math.random()*pick.offers.length)];
        offer.action();
        resultMsg = `😵‍💫 Hypnosis: rolled ${die(eff)}${banked?` (${banked} banked)`:''} — success! ${pick.n.name} is hypnotized into giving you "${offer.label}" for free.`;
      } else {
        resultMsg = `😵‍💫 Hypnosis: rolled ${die(eff)}${banked?` (${banked} banked)`:''} — success, but no traveler had anything to offer.`;
      }
    } else {
      resultMsg = `😵‍💫 Hypnosis: rolled ${die(eff)}${banked?` (${banked} banked)`:''} — failed to hypnotize anyone.`;
    }
  } else if(kind==='bareFangs'){
    if(state.food<foodCost) return;
    state.perLocation.snakeUsed = true;
    state.food -= foodCost;
    state.perLocation.bareFangsActive = true;
    const {eff, banked} = snakeRollBanked();
    let stole = eff>=6;
    if(stole) state.cash += 15;
    resultMsg = `🦷 Bare Fangs: your snake wards off attackers this location. Rolled ${die(eff)}${banked?` (${banked} banked)`:''}${stole?': stole $15 from would-be attackers!':': no bonus cash.'}`;
  } else if(kind==='desperateHunt'){
    state.perLocation.snakeUsed = true;
    state.food += 20;
    state.snakeRollMod -= 3;
    state.snakeHungryDebt += 10;
    resultMsg = `🐇 Desperate Hunt: +20 food. -3 to your next snake roll. No food consumed here, but the snake will need 10 food at your next location.`;
  }
  setResult('snakecharmer', resultMsg);
  log(resultMsg.replace(/<[^>]+>/g,''));
  saveGame(); render();
}
function forageForFood(){

function wolfRollWithHowl(){
  const first = roll();
  if(first>=6) return {eff:first, first, second:null};
  const second = roll();
  return {eff:second, first, second};
}
function wolfRollText(r){
  return r.second!==null ? `rolled ${die(r.first)} — failed, Wolf Howl rerolled: ${die(r.second)}` : `rolled ${die(r.first)}`;
}
function wolfAction(kind){
  if(!hasClass('wolftamer') || state.perLocation.wolfUsed) return;
  const foodCost = 10;
  if(state.food<foodCost) return;
  let resultMsg = '';
  if(kind==='lickWounds'){
    const idx = state.lingering.findIndex(l=>l.type==='bleed');
    if(idx<0) return;
    state.perLocation.wolfUsed = true;
    state.food -= foodCost;
    const name = state.lingering[idx].name;
    state.lingering.splice(idx,1);
    const r = wolfRollWithHowl();
    if(r.eff>=6){
      resultMsg = `👅 Lick Wounds: ${wolfRollText(r)}, stops the bleeding from ${name} — no infection.`;
    } else {
      state.lingering.push({name:'Infection', amt:10, type:'disease'});
      energyAdd(-15);
      resultMsg = `👅 Lick Wounds: ${wolfRollText(r)}, stops the bleeding from ${name} — but the wound gets infected: -15 energy.`;
    }
  } else if(kind==='viciousHunt'){
    state.perLocation.wolfUsed = true;
    state.food -= foodCost;
    const r = wolfRollWithHowl();
    let gain = 0, desc = 'the hunt fails';
    if(r.eff>=8){ gain = 25; desc = 'brings down a large animal'; }
    else if(r.eff>=3){ gain = 20; desc = 'brings down a medium animal'; }
    state.food += gain;
    resultMsg = `🗡️ Vicious Hunt: ${wolfRollText(r)} — your wolf ${desc}${gain?`, +${gain} food`:''}.`;
  } else if(kind==='goFetch'){
    state.perLocation.wolfUsed = true;
    state.food -= foodCost;
    const r = wolfRollWithHowl();
    if(r.eff>=8 && !state.items.gun){
      state.items.gun = true;
      resultMsg = `🐕 Go Fetch: ${wolfRollText(r)} — your wolf fetches back a gun.`;
    } else if(r.eff>=4){
      const desc = grantRandomSmallItem();
      resultMsg = `🐕 Go Fetch: ${wolfRollText(r)} — your wolf fetches back ${desc}.`;
    } else {
      resultMsg = `🐕 Go Fetch: ${wolfRollText(r)} — your wolf comes back empty-handed.`;
    }
  }
  setResult('wolftamer', resultMsg);
  log(resultMsg.replace(/<[^>]+>/g,''));
  saveGame(); render();
}

function almsEligible(npc, offer){
  return hasClass('vagrant') && !state.almsUsed && offer.minor && classColor(npc.classId)==='white';
}
function congregationMember(npc){
  if(hasClass('pastor') && npc.predestined) return true;
  if(hasClass('missionary') && npc.converted) return true;
  if(hasClass('hellfirepreacher') && npc.sermonAttended) return true;
  return false;
}
function effectiveOfferCost(npc, offer){
  if(almsEligible(npc, offer)) return 0;
  let cost = offer.cost;
  if(cost>0 && congregationMember(npc)) cost = Math.max(0, cost-5);
  return cost;
}
function tradeBuy(npcIdx, offerIdx){
  const npc = state.npcs[npcIdx];
  const offers = npcOffer(npc, curLevel());
  const offer = offers[offerIdx];
  const key = `${npcIdx}_${offerIdx}`;
  if(!offer) return;
  const cost = effectiveOfferCost(npc, offer);
  if(state.cash < cost) return;
  if(state.perLocation.usedOffers && state.perLocation.usedOffers[key]) return;
  if(offer.needsAffliction && !state.lingering.some(l=>l.type===offer.needsAffliction)) return;
  if(offer.disabledIf && offer.disabledIf()) return;
  const usedAlms = almsEligible(npc, offer);
  state.cash -= cost;
  if(usedAlms) state.almsUsed = true;
  offer.action();
  if(!state.perLocation.usedOffers) state.perLocation.usedOffers = {};
  state.perLocation.usedOffers[key] = true;
  setResult(`trade_${npcIdx}`, state.log[0]);
  saveGame(); render();
}

function sellGun(){
  if(state.gunsForSale<=0) return;
  state.gunsForSale -= 1; state.cash += 40;
  log('Sold a spare gun to a passing wagon for $40.');
  saveGame(); render();
}

function advanceNpcQueue(){
  const next = (state.npcRequestQueue && state.npcRequestQueue.length) ? state.npcRequestQueue.shift() : null;
  state.npcRequest = next;
  if(next) playApproach();
}

function resolveNpcRequest(accept){
  const req = state.npcRequest;
  if(!req) return;
  if(req.type==='missionaryConvertOffer'){
    if(accept){ state.playerConverted = true; log(`You accept ${req.npc}'s invitation and convert to Mormonism.`); }
    else { log(`You decline ${req.npc}'s invitation to convert.`); }
    advanceNpcQueue();
    saveGame(); render(); return;
  }
  if(accept){
    if(req.energy && state.energy < req.energy){
      log(`Not enough energy to help ${req.npc}.`);
      advanceNpcQueue(); saveGame(); render(); return;
    }
    if(req.totemCost && state.totems<2){ advanceNpcQueue(); saveGame(); render(); return; }
    if(req.foodCost && state.food<req.foodCost){ advanceNpcQueue(); saveGame(); render(); return; }
    if(req.cashCost && state.cash<req.cashCost){
      log(`Not enough cash to help ${req.npc}.`);
      advanceNpcQueue(); saveGame(); render(); return;
    }
    if(req.foodCost) state.food -= req.foodCost;
    if(req.cashCost) state.cash -= req.cashCost;
    if(req.foodGain) state.food += req.foodGain;
    energyAdd(-(req.energy||0) + (req.energyGain||0));
    state.cash += req.pay;
    if(req.rollModGain) state.rollMod += req.rollModGain;
    if(req.type==='sellMedicine') state.medicine -= 1;
    if(req.type==='buyGun') state.gunsForSale -= 1;
    if(req.type==='buyTotems') state.totems -= 2;
    if(req.type==='buyRepairKit') state.repairKitsForSale -= 1;
    if(req.type==='buyAntiVenom') state.antiVenom -= 1;
    if(req.type==='buyLeeches') state.witchLeeches -= 1;
    if(req.type==='buyHolyWater') state.holyWater -= 1;
    if(req.sermonGrant && req.npcIdx>=0 && state.npcs[req.npcIdx]) state.npcs[req.npcIdx].sermonAttended = true;
    let extra = '';
    if(req.healRoll){ const r = roll(); const gain = r===10?20:(r>=6?15:10); extra = ` Rolled ${r} for Prayer of Mending: restored ${gain} energy to them.`; }
    if(req.type==='rangerAssist') extra += ` They gain +3 to their next roll.`;
    let parts = [];
    if(req.pay) parts.push(`+$${req.pay}`);
    if(req.cashCost) parts.push(`-$${req.cashCost}`);
    if(req.foodGain) parts.push(`+${req.foodGain} food`);
    if(req.energy) parts.push(`-${req.energy} energy`);
    if(req.energyGain) parts.push(`+${req.energyGain} energy (bonus)`);
    if(req.rollModGain) parts.push(`+${req.rollModGain} to your next roll`);
    log(`Helped ${req.npc}: ${parts.join(', ')}.${extra}`);
  } else {
    log(`Declined to help ${req.npc}.`);
  }
  advanceNpcQueue();
  saveGame(); render();
}

  if((hasClass('ranger')||hasClass('snakecharmer')) && state.antiVenom>0) added += maybeAdd(0.45, ()=>({type:'buyAntiVenom', text:'wanting to buy Anti-Venom off you', pay:15, energy:0}))?1:0;
  if(hasClass('woodworker')) added += maybeAdd(0.45, ()=>({type:'repairService', text:'suffering wagon damage and wanting Emergency Roadside Assistance', pay:30, energy:5}))?1:0;
  if(hasClass('vagrant')) added += maybeAdd(0.45, ()=>({type:'pledgeProtection', text:'wanting to buy a Pledge of Protection from you', pay:20, energy:0}))?1:0;
  if(hasClass('butcher')) added += maybeAdd(0.45, ()=>({type:'butcherLivestock', text:'mourning a dead animal, hoping you\'ll butcher it for them', pay:0, energy:0, foodGain:5}))?1:0;
  if(hasClass('butcher')) added += maybeAdd(0.45, ()=>({type:'butcherAnimalForTraveler', text:'carrying a fresh kill, hoping you\'ll butcher it for them', pay:0, energy:0, foodGain:5}))?1:0;

  if(state.loc>0){
    if(hasClass('doctor')){
      added += maybeAdd(0.5, ()=>({type:'cureDisease', text:'suffering from a nasty ailment and comes to you for a cure', pay:30+10*level, energy:5+5*level}))?1:0;
      added += maybeAdd(0.5, ()=>({type:'stitchWound', text:'nursing a bleeding wound and comes to you for stitches', pay:15+5*level, energy:0}))?1:0;
    }
    if(hasClass('blacksmith')){
      added += maybeAdd(0.5, ()=>({type:'woundCare', text:'nursing a bad wound and comes to you for treatment', pay:15, energy:0}))?1:0;
      added += maybeAdd(0.5, ()=>({type:'bulletSmithingService', text:'wanting you to improve their gun (Bullet Smithing)', pay:25, energy:0}))?1:0;
    }
  }

  if(!hasClass('missionary') && !state.playerPredestined && !state.playerConverted && !state.sermonAttended && state.loc===0){
    const missionaryNpc = state.npcs.find(n=>n.classId==='missionary');
    if(missionaryNpc && npcCanConvert(missionaryNpc)){
      const totalTravelers = state.npcs.length+1;
      const predestinedCount = state.npcs.filter(n=>n.predestined).length + (state.playerPredestined?1:0);
      const X = Math.max(1, totalTravelers-predestinedCount);
      if(Math.random() < 3/X){
        state.npcRequestQueue.push({npc: missionaryNpc.name, npcIdx: state.npcs.indexOf(missionaryNpc), level, type:'missionaryConvertOffer', text:'inviting you to convert to Mormonism', pay:0, energy:0});
        added++;
      }
    }
  }

  if(added===0){
    log('You check in with your fellow travelers, but no one needs anything from you right now.');
  } else {
    log(`You check in with your fellow travelers: ${added} of them have something to ask.`);
  }
  if(!state.npcRequest) advanceNpcQueue();
  saveGame(); render();
}

/* ============ RENDER ============ */

function weatherVisual(ev){
  if(!ev || ev.cat!=='WEATHER') return {cls:'', emoji:''};
  const n = ev.name.toLowerCase();
  if(n.includes('sun')) return {cls:'weather-sun', emoji:'☀️'};
  if(n.includes('rain')) return {cls:'weather-rain', emoji:'🌧️'};
  if(n.includes('snow')) return {cls:'weather-snow', emoji:'❄️'};
  return {cls:'', emoji:''};
}
function tierRangeLabel(tiers, idx){
  const upper = idx===0 ? 10 : tiers[idx-1].min-1;
  return tiers[idx].min===upper ? `${tiers[idx].min}` : `${tiers[idx].min}-${upper}`;
}

function describeEventOutcomes(ev){
  const tiers = [...ev.tiers].sort((a,b)=>b.min-a.min);
  let html = '<ul style="margin:6px 0; padding-left:20px; font-size:.85em;">';
  tiers.forEach((t,i)=>{
    let parts = [];
    if(t.e) parts.push(`lose ${t.e} energy`);
    if(t.cash) parts.push(`lose $${t.cash}`);
    if(t.foodLoss) parts.push(`lose ${t.foodLoss} food`);
    if(t.foodLossPct) parts.push(`spoil ~${Math.round(t.foodLossPct*100)}% of your food`);
    if(parts.length===0) parts.push('no loss');
    if(t.feed) parts.push(`choose to feed ${t.feed} food or your livestock dies`);
    if(t.sick) parts.push(`your livestock may fall ill`);
    if(t.wagon) parts.push(`your wagon may break down`);
    if(t.linger) parts.push(`lingers -${t.linger} energy/location until cured`);
    if(t.bleed) parts.push(`bleeds -${t.bleed} energy/location until treated`);
    if(t.venom) parts.push(`envenomed -${t.venom} energy/location until cured`);
    if(t.poison) parts.push(`poisoned -${t.poison} energy/location until cured`);
    if(t.hex) parts.push(`hexed -${t.hex} energy/location until cured`);
    html += `<li>Roll ${tierRangeLabel(tiers,i)}: ${parts.join(', ')}.</li>`;
  });
  html += '</ul>';
  if(ev.mod) html += `<p style="font-size:.8em; margin:2px 0;"><em>${ev.mod} to this roll from the location itself.</em></p>`;
  let notes = [];
  if(ev.cat==='DISEASE' && hasClass('doctor')) notes.push('Doctor: this Disease drains 10 less energy.');
  if(ev.cat==='WOUND' && hasClass('blacksmith')) notes.push('Blacksmith: this Wound drains 5 less energy.');
  if(ev.cat==='WEATHER' && state.blessings.navigationReady) notes.push('Blessing of Navigation is ready: this Weather event will be fully negated!');
  if((ev.cat==='DISEASE'||ev.cat==='WOUND') && (hasClass('pastor') || state.blessings.healthActive)) notes.push('Blessing of Health: energy loss will be halved, and cured at the next Lodge.');
  if((ev.cat==='THEFT'||ev.cat==='WEATHER') && (hasClass('pastor')||state.blessings.protectionActive)) notes.push('🛡️ Blessing of Protection: +1 to this roll.');
  if(ev.cat==='THEFT' && state.pledgeProtectionActive) notes.push('Pledge of Protection: +2 to this roll.');
  if(ev.cat==='THEFT' && hasClass('outlaw')) notes.push('Ruthless: you will lose nothing to this theft, and may steal back $20.');
  if(ev.cat==='LIVESTOCK' && state.livestock && state.livestock.alive && livestockRollBonus()) notes.push(`+${livestockRollBonus()} to this roll (livestock + Animal Husbandry).`);
  if(ev.cat==='WAGON' && hasClass('woodworker')) notes.push('Wagoneer: +2 to this roll.');
  if(ev.cat==='WEATHER' && state.readStarsGuess && !state.readStarsConsumed) notes.push(`Read the Stars: predicted ${state.readStarsGuess} — +3 if this matches.`);
  if(ev.cat==='WEATHER' && hasClass('butcher') && ev.tiers.some(t=>t.foodLoss||t.foodLossPct)) notes.push('🧂 Food Preservation: any food spoilage here will be halved.');
  if(state.blessings.ardorActive) notes.push('Blessing of Ardor: +1 to this roll.');
  if(ev.cat==='POISON' && state.items.fieldGuide) notes.push('🗺️ Field Guide: +2 to this roll — you can identify bad food.');
  if(state.blessings.doveNatureActive && (ev.cat==='POISON'||ev.cat==='VENOM'||ev.cat==='HEX')) notes.push('🌳 Blessing of Nature: +2 to this roll.');
  if(ev.cat==='VENOM' && state.antiVenom>0) notes.push('🐍 You may use Anti-Venom on this Event to reduce its severity.');
  const afflictionPenaltyPreview = activeAfflictionPenalty();
  if(afflictionPenaltyPreview){
    if(state.blessings.banishmentActive) notes.push(`🚫 Blessing of Banishment purges the ${afflictionPenaltyPreview} affliction roll penalty.`);
    else notes.push(`🤒 -${afflictionPenaltyPreview} to this roll from active afflictions.`);
  }
  if(notes.length) html += `<p style="font-size:.8em; margin:2px 0; color:var(--good);">${notes.join(' ')}</p>`;
  return html;
}

function describeActionOption(opt){
  let reqs = [];
  if(opt.min) reqs.push(`requires ${opt.min}+ energy`);
  if(opt.gun && !opt.curse) reqs.push('requires a gun');
  let flat = [];
  if(opt.e) flat.push(`${opt.e>0?'+':''}${opt.e} energy`);
  if(!opt.tiers){
    if(opt.cash) flat.push(`+$${opt.cash}`);
    if(opt.mod) flat.push(`+${opt.mod} to next roll`);
    let out = flat.length ? flat.join(', ') : 'no other effect';
    return (reqs.length ? `<em>${reqs.join(', ')}.</em> `:'') + out + '.';
  }
  const tiers = [...opt.tiers].sort((a,b)=>b.min-a.min);
  const lines = tiers.map((t,i)=>{
    let parts = [];
    if(t.food!==undefined) parts.push(`+${t.food} food`);
    if(t.cash) parts.push(`+$${t.cash}`);
    if(t.mod) parts.push(`+${t.mod} to next roll`);
    if(parts.length===0) parts.push('no gain');
    return `<li>Roll ${tierRangeLabel(tiers,i)}: ${parts.join(', ')}</li>`;
  }).join('');
  const huntNote = opt.hunt ? `<p style="font-size:.8em; margin:2px 0; color:var(--good);">Also yields an Animal (size scales with your roll) for the Butcher's use.</p>` : '';
  return (reqs.length ? `<em>${reqs.join(', ')}.</em> `:'') + (flat.length?flat.join(', ')+'. ':'') + `<ul style="margin:4px 0; padding-left:18px; font-size:.85em;">${lines}</ul>${huntNote}`;
}

function bindIntroEvents(){
  let selected = [];
  let selectedColors = [];
  const cards = document.querySelectorAll('.class-card');
  const beginBtn = document.getElementById('beginBtn');
  function refresh(){
    cards.forEach(card=>{
      const id = card.dataset.id;
      const colors = card.dataset.colors.split(',');
      card.classList.toggle('selected', selected.includes(id));
      const blocked = !selected.includes(id) && selected.length>=2;
      const colorBlocked = !selected.includes(id) && colors.some(c=>selectedColors.includes(c));
      card.classList.toggle('blocked', blocked || colorBlocked);
    });
    beginBtn.disabled = selected.length!==2;
  }
  cards.forEach(card=>{
    card.addEventListener('click', ()=>{
      const id = card.dataset.id;
      const colors = card.dataset.colors.split(',');
      if(selected.includes(id)){
        selected = selected.filter(x=>x!==id);
        selectedColors = selectedColors.filter(c=>!colors.includes(c));
      } else if(selected.length<2 && !colors.some(c=>selectedColors.includes(c))){
        selected.push(id); selectedColors.push(...colors);
      }
      refresh();
    });
  });
  beginBtn.addEventListener('click', ()=>{
    document.getElementById('app').innerHTML = renderLivestockScreen(selected);
    document.getElementById('oxBtn').addEventListener('click', ()=>startGame(selected,'ox'));
    document.getElementById('muleBtn').addEventListener('click', ()=>startGame(selected,'mule'));
  });
}

function renderNpcRequest(){
  const req = state.npcRequest;
  if(!req) return '';
  const npcObj = (req.npcIdx>=0) ? state.npcs[req.npcIdx] : null;
  const npcClassLabel = npcObj ? ` (${CLASSES.find(c=>c.id===npcObj.classId).name})` : '';
  if(req.type==='missionaryConvertOffer'){
    return `<div class="panel" style="border-color:var(--gold);">
      <h2>A Traveler Approaches</h2>
      <p>${req.npc}${npcClassLabel}, the Missionary of your wagon, is ${req.text}. Joining grants you Blessing of Navigation and discounted services from them, but commits your faith.</p>

      <button class="secondary" onclick="resolveNpcRequest(false)">Decline</button>
    </div>`;
  }
  const cantAfford = (req.energy && state.energy<req.energy) || (req.totemCost && state.totems<2) || (req.foodCost && state.food<req.foodCost) || (req.cashCost && state.cash<req.cashCost);
  const queueNote = state.npcRequestQueue && state.npcRequestQueue.length ? `<p style="font-size:.8em; opacity:.75;">${state.npcRequestQueue.length} more waiting after this one.</p>` : '';
  let benefits = [];
  if(req.pay) benefits.push(`$${req.pay}`);
  if(req.foodGain) benefits.push(`${req.foodGain} food`);
  let costs = [];
  if(req.cashCost) costs.push(`$${req.cashCost}`);
  if(req.energy) costs.push(`${req.energy} energy`);
  if(req.foodCost) costs.push(`${req.foodCost} food (feeding your falcon)`);
  let dealText = '';
  if(benefits.length) dealText += `They will give you <strong>${benefits.join(' and ')}</strong>.`;
  if(costs.length) dealText += ` It will cost you <strong>${costs.join(' and ')}</strong> to help them.`;

    <p>${req.npc}${npcClassLabel} are ${req.text}. ${dealText}</p>

    <button class="secondary" onclick="resolveNpcRequest(false)">Decline</button>

}
