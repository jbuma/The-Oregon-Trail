  const loc = currentLocation();
  if(state.phase==='lodge_shop'){

    }
    if(!pe.resolved){
      if(pe.def.branches && !pe.chosenBranch){
        return `
          <h2>${loc.name} — Event</h2>
          <div class="card-box event">
            <span class="tag">${pe.def.cat}</span><span class="tag">${pe.def.diff}</span><span class="tag">LEVEL ${loc.level}</span>
            <h3 style="border:none;">${pe.def.name}</h3>
            <p>Choose how to respond:</p>
            ${pe.def.branches.map(b=>{
              const locked = b.requiresGun && !state.items.gun;
              return `<p><button ${locked?'disabled':''} onclick="chooseEventBranch('${b.key}')">${b.label}${locked?' (needs a gun)':''}</button></p>`;
            }).join('')}
          </div>
        `;
      }
      const effDef = effectiveEventDef(pe);
      const stormMsg = getResult('shaman_storm');
      const wv = weatherVisual(effDef);
      return `
        <h2>${loc.name} — Event</h2>
        <div class="card-box event ${wv.cls}">
          ${wv.emoji?`<span class="weather-emoji">${wv.emoji}</span>`:''}
          <span class="tag">${pe.def.cat}</span><span class="tag">${pe.def.diff}</span><span class="tag">LEVEL ${loc.level}</span>
          <h3 style="border:none;">${pe.def.name}</h3>
          ${describeEventOutcomes(effDef)}
          ${hasClass('doctor') && (state.perLodge.triageCharges||0)>0 ? `<button onclick="rerollEvent()">Doctor's Triage: discard, draw a new Event (${state.perLodge.triageCharges} left this Lodge)</button>` : ''}
          ${hasClass('shaman') && state.totems>0 && !pe.totemPending ? `<button onclick="useShamanTotemEvent()">Use Blood Totem (Sacrifice 5 food, +3 to roll)</button>` : ''}
          ${hasClass('shaman') && pe.def.cat==='WEATHER' && !pe.stormAttempted ? `<button onclick="shamanStormRitual()">Storm Calming Ritual (sacrifice ${5*loc.level} food, roll 3-10 with -${loc.level})</button>` : ''}

          ${pe.def.cat==='DISEASE' && state.medicine>0 && !pe.medicineUsed ? `<button onclick="useMedicineOnEvent()">Use Medicine (have ${state.medicine}) — -15 energy loss, ignore modifier</button>` : ''}
          ${pe.def.cat==='VENOM' && state.antiVenom>0 && !pe.antiVenomUsed ? `<button onclick="useAntiVenomOnEvent()">Use Anti-Venom (have ${state.antiVenom}) — -15 energy loss, ignore modifier</button>` : ''}
          ${hasClass('vagrant') && pe.def.cat==='THEFT' && !pe.resilienceAttempted && state.energy>=5 ? `<button onclick="vagrantResilienceEvent()">Resilience: sacrifice 5 energy, roll 6-10 to prevent theft</button>` : ''}
          ${getResult('vagrant_resilience') ? `<p class="result-line">${getResult('vagrant_resilience')}</p>` : ''}
          ${(hasClass('outlaw')||hasClass('witchdoctor')||hasClass('shaman')||hasClass('snakecharmer')||hasClass('exorcist')) && state.energy>=10 ? `<button onclick="useRiskyOpportunist()">Risky Opportunist: sacrifice 10 energy for +2 to this roll</button>` : ''}
          ${hasClass('fortuneteller') && !state.perLocation.loadedDiceUsed ? `
            <p style="font-size:.85em; margin:8px 0 2px;">Loaded Dice — will you hit the best outcome?</p>
            <button class="small" onclick="predictLoadedDice(true)">Yes</button>
            <button class="small" onclick="predictLoadedDice(false)">No</button>` : ''}
          <p style="margin-top:10px;"><button onclick="resolveEvent()">Face it — Roll</button></p>
        </div>
      `;
    }
    { const effDef = effectiveEventDef(pe); const wv = weatherVisual(effDef);
    return `<h2>${loc.name} — Event Resolved</h2><div class="card-box event ${wv.cls}">${wv.emoji?`<span class="weather-emoji">${wv.emoji}</span>`:''}<p><strong>${pe.def.name}</strong> (${pe.def.cat} · ${pe.def.diff})</p>
      <div class="result-block">${pe.resultLines.map(l=>`<div class="rline">${l}</div>`).join('')}</div>
      <p style="font-size:.8em; opacity:.75; margin:8px 0 2px;">Roll tiers for this Event, for reference:</p>
      ${describeEventOutcomes(effDef)}</div>
      <button onclick="goToAction()">Continue to Action →</button>`; }
  }
  if(state.phase==='action'){
    const pa = state.pendingAction;
    if(!pa.resolved){
      return `
        <h2>${loc.name} — Action</h2>
        <div class="card-box action">
          <span class="tag">CHOOSE ONE</span>
          <h3 style="border:none;">${pa.def.name}</h3>
          ${(hasClass('outlaw')||hasClass('witchdoctor')||hasClass('shaman')||hasClass('snakecharmer')||hasClass('exorcist')) && state.energy>=10 ? `<button onclick="useRiskyOpportunist()">Risky Opportunist: sacrifice 10 energy for +2 to your next roll</button>` : ''}
          ${hasClass('shaman') && state.totems>0 && !pa.totemPending && state.food>=5 ? `<button onclick="useShamanTotemAction()">Use Blood Totem (Sacrifice 5 food, +3 to roll)</button>` : ''}
          ${pa.totemPending ? `<p class="result-line">🩸 Blood Totem readied: +3 to your next Action roll.</p>` : ''}
          ${pa.def.options.map((o,i)=>{
            const locked = actionLocked(o);
            const why = actionWhy(o);
            return `<div class="option"><strong>${o.label}</strong><div>${describeActionOption(o)}</div><p><button ${locked?'disabled':''} onclick="resolveAction(${i})">${locked?why:'Choose'}</button></p></div>`;
          }).join('')}
          ${hasClass('ranger') && !state.perLodge.frontierExpertUsed && pa.def.options.length>=2 ? `<p><button class="small" ${(actionLocked(pa.def.options[0])||actionLocked(pa.def.options[1]))?'disabled':''} onclick="resolveBothActions()">🌲 Frontier Expert: Perform Both Actions</button></p>` : ''}
        </div>
      `;
    }
    let tierInfo = '';
    if(pa.chosenIndex>=0 && pa.def.options[pa.chosenIndex].tiers){
      const o = pa.def.options[pa.chosenIndex];
      tierInfo = `<p style="font-size:.8em; opacity:.75; margin:8px 0 2px;">Roll tiers for "${o.label}", for reference:</p>${describeActionOption(o)}`;
    } else if(pa.chosenIndex===-1){
      tierInfo = pa.def.options.filter(o=>o.tiers).map(o=>`<p style="font-size:.8em; opacity:.75; margin:8px 0 2px;">Roll tiers for "${o.label}", for reference:</p>${describeActionOption(o)}`).join('');
    }
    return `<h2>${loc.name} — Action Resolved</h2><div class="card-box action"><p><strong>${pa.def.name}</strong></p><div class="result-block">${pa.resultLines.map(l=>`<div class="rline">${l}</div>`).join('')}</div>${tierInfo}</div>
      <button onclick="advanceLocation()">Move to Next Location →</button>`;
  }
  return '';
}

function renderItemsBox(){
  const avResult = getResult('antivenom_cure');
  const hwResult = getResult('holywater');
  const leechResult = getResult('leeches_apply');
  const hasVenom = state.lingering.some(l=>l.type==='venom');
  const showAntiVenom = hasClass('ranger') || hasClass('snakecharmer') || (state.antiVenom||0)>0;
  const showHolyWater = hasClass('exorcist') || (state.holyWater||0)>0;
  const showLeeches = hasClass('witchdoctor') || (state.witchLeeches||0)>0 || getResult('leeches_apply');
  let html = `<div class="trader-block items-panel"><div class="tname">Items</div>
    <p style="font-size:.8em;">Inventory: ${inventoryList()}</p>
    <button class="small" ${state.food<5?'disabled':''} onclick="eatFood(5)">Eat 5 food (+5 energy)</button>
    <button class="small" ${state.food<10?'disabled':''} onclick="eatFood(10)">Eat 10 food (+10 energy)</button>`;
  if(showAntiVenom){
    html += `<p class="desc-line">Anti-Venom (${state.antiVenom||0} left). Use it any time to instantly cure an active Envenomed status, or in advance on a Venom Event to soften the bite.</p>
      <button class="small" ${(!hasVenom || (state.antiVenom||0)<=0)?'disabled':''} onclick="useAntiVenomCure()">Cure Envenomed Status</button>
      ${avResult ? `<p class="result-line">${avResult}</p>` : ''}`;
  }
  if(showHolyWater){
    html += `<p class="desc-line">Holy Water (${state.holyWater||0} left). Restores 10 energy on use, or 20 if an affliction or negative roll modifier was purged at this location.</p>
      <button class="small" ${(state.holyWater||0)<=0?'disabled':''} onclick="useHolyWater()">Drink Holy Water</button>
      ${hwResult ? `<p class="result-line">${hwResult}</p>` : ''}`;
  }
  if(showLeeches){
    html += `<p class="desc-line">Jar of Leeches (${state.witchLeeches||0} left, requires 50+ energy). Roll 8-10 restore 20 energy, roll 4-7 restore 15 energy, roll 1-3 restore 10 energy. -3 to your next roll.</p>
      <button class="small" ${(state.witchLeeches||0)<=0||state.energy<50?'disabled':''} onclick="witchDoctorLeeches()">Apply leeches to your body</button>
      ${leechResult ? `<p class="result-line">${leechResult}</p>` : ''}`;
  }
  html += `</div>`;
  return html;
}

function renderTradingPost(){
  let html = `<details ${uiState.tradingPostOpen?'open':''} ontoggle="uiState.tradingPostOpen=this.open"><summary>Talk to Fellow Travelers (Trading Post)</summary>`;
  html += `<p><button class="small" ${state.perLocation.interactionsChecked?'disabled':''} onclick="checkInteractions()">Check Interactions</button> <span style="font-size:.82em; opacity:.75;">See if any fellow travelers want to buy what you're selling.</span></p>`;
  orderedNpcIndices().forEach(i=>{
    const n = state.npcs[i];
    const offers = npcOffer(n, curLevel());
    if(offers.length===0) return;
    const tags = [n.converted?'converted':null, n.predestined?'predestined':null, n.sermonAttended?'attended sermon':null].filter(Boolean).join(', ');
    html += `${traderBlockOpen(n.classId)}<div class="tname">${classEmoji(n.classId)} ${n.name} <span style="font-size:.7em; opacity:.7;">(${CLASSES.find(c=>c.id===n.classId).name}${tags?', '+tags:''})</span></div>`;
    offers.forEach((o,oi)=>{
      const key = `${i}_${oi}`;
      const usedHere = state.perLocation.usedOffers && state.perLocation.usedOffers[key];
      const missingAffliction = o.needsAffliction && !state.lingering.some(l=>l.type===o.needsAffliction);
      const genericLocked = o.disabledIf && o.disabledIf();
      const effCost = effectiveOfferCost(n, o);
      const cantAfford = state.cash<effCost;
      const disabled = cantAfford || missingAffliction || usedHere || genericLocked;
      const label = almsEligible(n, o) ? `${o.label} — FREE (Alms)` : (effCost<o.cost ? `${o.label} — $${effCost} (congregation discount)` : o.label);
      let badge = '';
      if(usedHere || (genericLocked && o.already)) badge = `<span class="offer-badge owned" data-tip="Already bought or active — nothing more to do here.">✓</span>`;
      else if(missingAffliction) badge = `<span class="offer-badge locked" data-tip="Requires an active ${o.needsAffliction} affliction.">🔒</span>`;
      else if(genericLocked) badge = `<span class="offer-badge locked" data-tip="Not available right now — you don't meet the requirement for this.">🔒</span>`;
      html += `<div style="margin:6px 0;"><button class="small" ${o.desc?`data-tip="${escAttr(o.desc)}"`:''} ${disabled?'disabled':''} onclick="tradeBuy(${i},${oi})">${label}</button>${badge}</div>`;
    });
    if(hasClass('missionary') && state.loc===0){
      const canConvert = !state.playerPredestined && npcCanConvert(n) && (state.conversionsUsed||0)<2;
      html += `<div style="margin:6px 0;"><button class="small" data-tip="Joins this traveler to your congregation: they hold Blessing of Navigation for free and receive discounts on Prayer of Sustenance and Blessing of Energy from you. Limited to 2 conversions, Lodge 1 only." ${canConvert?'':'disabled'} onclick="convertNpc(${i})">Convert to Mormonism (${state.conversionsUsed||0}/2, Lodge 1 only)</button></div>`;
    }
    const tradeResult = getResult(`trade_${i}`);
    if(tradeResult) html += `<div class="result-line">${tradeResult}</div>`;
    html += '</div>';
  });
  html += '</details>';
  return html;
}

function renderReference(){
  if(state.classes.length===0) return '';
  let html = `<details ${uiState.referenceOpen?'open':''} ontoggle="uiState.referenceOpen=this.open"><summary>How My Classes Work (Reference)</summary>`;
  state.classes.forEach(id=>{
    const c = CLASSES.find(x=>x.id===id);
    html += `${traderBlockOpen(id)}<div class="tname">${c.emoji} ${c.name}</div>${ABILITY_REFERENCE[id].map(a=>`<div class="ref-line">${a.icon} ${a.text}</div>`).join('')}</div>`;
  });
  if(hasClass('outlaw')||hasClass('witchdoctor')||hasClass('shaman')||hasClass('snakecharmer')||hasClass('exorcist')){
    html += `<div class="trader-block c-black"><div class="tname">Black Passive: Risky Opportunist</div><div class="ref-line">🎰 Whenever you roll, you may sacrifice 10 energy for +2 to that roll.</div></div>`;
  }
  if(hasClass('farmer')||hasClass('falconer')||hasClass('snakecharmer')||hasClass('wolftamer')||hasClass('dovekeeper')){
    html += `<div class="trader-block c-green"><div class="tname">Green Passive: Forage</div><div class="ref-line">🌿 Once per location, forage for food. Find 5 food on a roll of 7-10.</div></div>`;
  }
  html += '</details>';
  return html;
}

function renderNpcs(){
  const items = orderedNpcIndices().map(i=>{
    const n = state.npcs[i];
    const tags = [n.converted?'converted':null, n.predestined?'predestined':null, n.sermonAttended?'sermon':null].filter(Boolean).join(', ');
    return `<div>${classEmoji(n.classId)} ${n.name} (${CLASSES.find(c=>c.id===n.classId).name}${tags?', '+tags:''})</div>`;
  });
  return `<div class="npc-list">${items.join('')}</div>`;
}

}
function renderVictory(){
  return `<div class="title-banner"><h1>THE OREGON TRAIL</h1></div>
    <div class="panel gameover"><h2 style="color:var(--good)">You made it to Oregon!</h2>
    <p>Final stats — Energy: ${state.energy} · Cash: $${state.cash} · Food: ${state.food}</p>
    <button onclick="newGame()">Play Again</button></div>
    <div class="panel"><h3>Trail Journal</h3><div class="log">${state.log.map(l=>`<div>${l}</div>`).join('')}</div></div>`;
}

(async function init(){
  const loaded = await loadGame();
  if(loaded) state = loaded;
  render();
})();
</script>
